<script>
/* ===== Mathe-Kern: Parser, Prüfung, Generatoren ===== */
const rd = n => Math.round(n * 1000) / 1000;
const r = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const rnz = (a, b) => { let v = 0; while (v === 0) v = r(a, b); return v; };
const rsg = (a, b) => r(a, b) * (Math.random() < 0.5 ? -1 : 1);
const pick = a => a[Math.floor(Math.random() * a.length)];
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function normalize(s) {
  return String(s).toLowerCase()
    .replace(/[−–—]/g, '-').replace(/[·×∙•*]/g, '*').replace(/:/g, '/')
    .replace(/[\[{]/g, '(').replace(/[\]}]/g, ')').replace(/\s+/g, '');
}

function tokenize(s) {
  s = normalize(s);
  const t = []; let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (/[0-9.,]/.test(ch)) {
      let j = i; while (j < s.length && /[0-9.,]/.test(s[j])) j++;
      const raw = s.slice(i, j).replace(',', '.');
      if (!/^\d*\.?\d+$|^\d+\.?$/.test(raw)) throw new Error('Zahl');
      t.push({ k: 'n', v: parseFloat(raw) }); i = j; continue;
    }
    if (/[a-z]/.test(ch)) { t.push({ k: 'v', v: ch }); i++; continue; }
    if (ch === '²' || ch === '³') { t.push({ k: '^' }); t.push({ k: 'n', v: ch === '²' ? 2 : 3 }); i++; continue; }
    if ('+-*/^()'.includes(ch)) { t.push({ k: ch }); i++; continue; }
    throw new Error('Zeichen');
  }
  return t;
}

function parse(str) {
  const tk = tokenize(str); let p = 0;
  if (!tk.length) throw new Error('leer');
  const peek = () => tk[p], next = () => tk[p++];
  function expr() {
    let n = term();
    while (peek() && (peek().k === '+' || peek().k === '-')) { const op = next().k; n = { k: op, a: n, b: term() }; }
    return n;
  }
  function term() {
    let n = group();
    while (peek() && (peek().k === '*' || peek().k === '/')) { const op = next().k; n = { k: op, a: n, b: group() }; }
    return n;
  }
  function group() {

        `Zähler verrechnen: ${a1 * e1} ${sg > 0 ? '+' : '−'} ${a2 * e2} = ${numD(N)}` + (g > 1 ? `, dann durch ${g} kürzen` : ''),
        `Ergebnis: ${res}`]
    };
  }
};

/* Antwort prüfen: liefert {status: 'ok'|'almost'|'wrong'|'unreadable', msg} */
function checkAnswer(task, input) {
  if (task.type === 'num') {
    let v; try { v = ev(parse(input), {}); } catch (e) { return { status: 'unreadable', msg: 'Das kann ich nicht lesen. Gib nur die Zahl ein.' }; }
    return Math.abs(v - Number(task.ans)) < 1e-6 ? { status: 'ok' } : { status: 'wrong' };
  }
  let u, s;
  try { u = parse(input); s = parse(task.ans); } catch (e) { return { status: 'unreadable', msg: 'Das kann ich nicht lesen. Prüf Klammern und Zeichen.' }; }
  if (!equiv(u, s)) return { status: 'wrong' };
  if (task.raw && normalize(input) === normalize(task.raw)) return { status: 'almost', msg: 'Das ist noch die Aufgabe selbst.' };
  if (task.form === 'simplified') { const f = isSimplified(input); if (!f.ok) return { status: 'almost', msg: 'Gleichwertig, aber noch nicht fertig. ' + f.why }; }
  if (task.form === 'factored' && !isFactored(input)) return { status: 'almost', msg: 'Gleichwertig, aber gesucht ist die Klammerform.' };
  if (task.form === 'gcf') {
    const m = normalize(input).match(/^([+-]?[^()+\-]*)\((.+)\)$/);
    if (!m) return { status: 'almost', msg: 'Gleichwertig, aber gesucht ist die Form Faktor · Klammer.' };
    let pre = m[1].replace(/\*$/, ''); if (pre === '' || pre === '+') pre = '1'; if (pre === '-') pre = '-1';
    try {
      const pa = parse(pre), g = parse(task.gcf);
      if (!(equiv(pa, g) || equiv(pa, { k: 'neg', a: g }))) return { status: 'almost', msg: 'Richtig umgeformt, aber da geht noch mehr vor die Klammer.' };
    } catch (e) { return { status: 'almost', msg: 'Gleichwertig, aber die Form passt noch nicht.' }; }
  }
  return { status: 'ok' };
}

/* ===== Arbeitsblätter: Prüflogik ===== */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const M = s => `<span class="m">${s}</span>`;
const op = s => `<span class="m"> ${s} </span>`;
const MX = (w, a, b) => `<span class="m">${w}</span>${F(a, b)}`;

function parseMono(t) {
  t = t.replace(/\*/g, '').replace(/,/g, '.');
  const m = t.match(/^([+-])?(\d+(?:\.\d+)?(?:\/\d+)?)?((?:[a-z](?:\^\d+)?)*)$/);
  if (!m || (!m[2] && !m[3])) return null;
  let c = 1;
  if (m[2]) { const q = m[2].split('/'); c = q.length > 1 ? Number(q[0]) / Number(q[1]) : Number(q[0]); }
  const ex = {}; (m[3].match(/[a-z](?:\^\d+)?/g) || []).forEach(t => { ex[t[0]] = (ex[t[0]] || 0) + (t.length > 1 ? +t.slice(2) : 1); });
  return { c: m[1] === '-' ? -c : c, L: Object.keys(ex), ex };
}
const isSqN = c => { const s = Math.sqrt(Math.abs(c)); return Math.abs(s * 100 - Math.round(s * 100)) < 1e-6; };
const evenEx = ex => Object.values(ex).every(e => e % 2 === 0);
function binomInside(mons) {
  if (mons.length === 2) { const [a, b] = mons; if (a.c * b.c < 0 && isSqN(a.c) && isSqN(b.c) && evenEx(a.ex) && evenEx(b.ex)) return 'In einer Klammer steckt noch die dritte binomische Formel. Die lässt sich weiter zerlegen.'; }
  if (mons.length === 3) {
    for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) {
      const a = mons[i], b = mons[j], m = mons[3 - i - j];
      if (a.c > 0 && b.c > 0 && isSqN(a.c) && isSqN(b.c) && evenEx(a.ex) && evenEx(b.ex)) {
        if (Math.abs(Math.abs(m.c) - 2 * Math.sqrt(a.c) * Math.sqrt(b.c)) > 1e-6) continue;
        const ok = [...new Set([...Object.keys(a.ex), ...Object.keys(b.ex), ...Object.keys(m.ex)])].every(l => (m.ex[l] || 0) * 2 === (a.ex[l] || 0) + (b.ex[l] || 0));
        if (ok) return 'In einer Klammer steckt noch eine binomische Formel. Die lässt sich als Quadrat schreiben.';
      }
    }
  }
  return null;
}

function factorCheck(raw) {
  let s = normalize(raw).replace(/²/g, '^2').replace(/³/g, '^3').replace(/^\+/, '');
  if (s.startsWith('-')) s = s.slice(1);
  if (topTerms(s).length !== 1) return { ok: false, why: 'Gesucht ist ein Produkt. Außerhalb der Klammern steht noch ein Plus oder Minus.' };
  if (!s.includes('(')) return { ok: false, why: 'Da fehlt noch die Klammer. Was alle Glieder gemeinsam haben, kommt vor die Klammer.' };
  const groups = []; let depth = 0, start = -1, outside = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '(') { if (depth === 0) start = i; depth++; }
    else if (ch === ')') { depth--; if (depth === 0) groups.push(s.slice(start + 1, i)); }
    else if (depth === 0) outside += ch;
  }
  if (groups.length === 1 && outside.replace(/\*/g, '') === '') return { ok: false, why: 'Eine Klammer um alles ist noch kein Ausklammern. Was haben alle Glieder gemeinsam?' };
  for (const g of groups) {
    const terms = topTerms(g); if (terms.length < 2) continue;
    const mons = terms.map(parseMono); if (mons.some(x => !x)) continue;
    if (mons.every(x => Number.isInteger(x.c))) {
      const gg = mons.reduce((a, x) => gcd(a, Math.abs(x.c)), 0);
      if (gg > 1) return { ok: false, why: `In einer Klammer ist noch jede Zahl durch ${gg} teilbar. Die ${gg} kann auch noch raus.` };
    }
    let common = null;
    mons.forEach(x => { common = common === null ? x.L.slice() : common.filter(l => x.L.includes(l)); });
    if (common && common.length) return { ok: false, why: `In einer Klammer haben noch alle Glieder ein ${common[0]}. Das kann auch noch raus.` };
    const bi = binomInside(mons); if (bi) return { ok: false, why: bi };
  }
  return { ok: true };
}

/* Baum als schöne Schreibweise, mit echten Brüchen */
function toH(n) {
  const isSum = x => x.k === '+' || x.k === '-';
  const varish = x => x.k === 'var' || (x.k === '^' && x.a.k === 'var');
  const wr = x => (isSum(x) || x.k === 'neg') ? '(' + h(x) + ')' : h(x);
  function h(n) {
    switch (n.k) {
      case 'num': return numD(n.v);
      case 'var': return n.v;
      case 'neg': return '−' + ((isSum(n.a) || n.a.k === 'neg') ? '(' + h(n.a) + ')' : h(n.a));
      case '+': return n.b.k === 'neg' ? h(n.a) + ' − ' + wr(n.b.a) : h(n.a) + ' + ' + h(n.b);
      case '-': return h(n.a) + ' − ' + wr(n.b);
      case '*': {
        const L = isSum(n.a) ? '(' + h(n.a) + ')' : h(n.a);
        const R = (isSum(n.b) || n.b.k === 'neg') ? '(' + h(n.b) + ')' : h(n.b);
        const imp = varish(n.b) || isSum(n.b) || (n.b.k === '^' && isSum(n.b.a));
        return L + (imp ? '' : ' · ') + R;
      }
      case '/': return F(h(n.a), h(n.b));
      case '^': {
        const B = (n.a.k === 'num' || n.a.k === 'var') ? h(n.a) : '(' + h(n.a) + ')';
        const e = n.b.k === 'num' && n.b.v === 2 ? '²' : n.b.k === 'num' && n.b.v === 3 ? '³' : '<sup>' + h(n.b) + '</sup>';
        return B + e;
      }
    }
    return '';
  }
  return '<span class="m">' + h(n) + '</span>';
}

function checkSet(t, input) {
  const s = String(input).replace(/[−–—]/g, '-');
  const nums = (s.match(/-?\d+/g) || []).map(Number);
  if (!nums.length) return { st: 'err', msg: 'Gib die Zahlen ein, zum Beispiel {1; 2; 3}.' };
  const U = [...new Set(nums)];
  for (const A of [t.ans].concat(t.alt ? [t.alt] : [])) if (U.length === A.length && U.every(x => A.includes(x))) return { st: 'done' };
  const extra = U.filter(x => !t.ans.includes(x) && !(t.alt && t.alt.includes(x)));
  const miss = t.ans.filter(x => !U.includes(x)).length;
  let msg = '';
  if (extra.length) msg += `Das gehört nicht rein: ${extra.map(numD).join('; ')}. `;
  if (miss) msg += miss === 1 ? 'Es fehlt noch eine Zahl.' : `Es fehlen noch ${miss} Zahlen.`;
  return { st: 'no', msg: msg.trim() };
}
const normIv = s => String(s).replace(/\s/g, '').replace(/[−–—]/g, '-').replace(/,/g, ';').replace(/unendlich|inf/gi, '∞').replace(/\+∞/g, '∞').replace(/^\(/, ']').replace(/\)$/, '[');
const ivD = a => a.replace(/-/g, '−').replace(/;/g, '; ');
function checkInterval(t, input) {
  const u = normIv(input), a = t.ans;
  if (u === a) return { st: 'done' };
  const re = /^([\[\]])(-?\d+|-∞);(-?\d+|∞)([\[\]])$/;
  const mu = u.match(re), ma = a.match(re);
  if (!mu) return { st: 'err', msg: 'Schreib es so: Klammer, Zahl, Semikolon, Zahl, Klammer. Zum Beispiel [−3; 2[' };
  const w = [];
  if (mu[2] !== ma[2]) w.push('die linke Zahl');
  if (mu[3] !== ma[3]) w.push('die rechte Zahl');
  if (mu[1] !== ma[1]) w.push('die linke Klammer');
  if (mu[4] !== ma[4]) w.push('die rechte Klammer');
  return { st: 'no', msg: 'Prüf ' + (w.length > 1 ? w.slice(0, -1).join(', ') + ' und ' + w[w.length - 1] : w[0]) + '.' };
}

function finalCheck(t, input) {
  const s = normalize(input);
  switch (t.form) {
    case 'num': return /^-?\d+([.,]\d+)?$/.test(s) ? { ok: true } : { ok: false, why: 'Rechne weiter, bis nur noch eine Zahl dasteht.' };
    case 'simp': return isSimplified(input);
    case 'fac': return factorCheck(input);
    case 'fos': { const f = isSimplified(input); return f.ok ? f : factorCheck(input); }
    case 'frac': {
      const L = x => normalize(x).replace(/\*/g, '').length;
      return L(input) <= L(t.ans) + 3 ? { ok: true } : { ok: false, why: 'Da lässt sich noch zusammenfassen oder kürzen.' };
    }
  }
  return { ok: true };
}

function checkBlatt(t, input, prevOk) {
  if (t.type === 'set') return checkSet(t, input);
  if (t.type === 'iv') return checkInterval(t, input);
  let u, s;
  try { u = parse(input); s = parse(t.ans); } catch (e) { return { st: 'err', msg: 'Das kann ich nicht lesen. Prüf Klammern und Zeichen.' }; }
  if (!equiv(u, s, t.tol)) return { st: 'no', msg: prevOk ? 'Hier hat sich ein Fehler eingeschlichen. Die Zeile davor stimmt noch, der Fehler steckt im Schritt dazwischen.' : 'Das passt noch nicht zur Aufgabe. Schon in diesem Schritt steckt ein Fehler.' };
  if (t.raw && normalize(input).replace(/\*/g, '') === normalize(t.raw).replace(/\*/g, '')) return { st: 'mid', msg: 'Das ist noch die Aufgabe selbst. Mach den ersten Schritt.' };
  const f = finalCheck(t, input);
  return f.ok ? { st: 'done' } : { st: 'ok', msg: 'Stimmt. ' + f.why };
}
function checkVal(t, input) {
  let v; try { v = ev(parse(input), {}); } catch (e) { return { ok: false, msg: 'Das kann ich nicht lesen. Gib nur die Zahl ein.' }; }
  if (!isFinite(v)) return { ok: false, msg: 'Da steht noch ein Buchstabe. Setz die Zahlen ein.' };
  return Math.abs(v - t.val.ans) < 1e-6 * Math.max(1, Math.abs(t.val.ans)) ? { ok: true } : { ok: false, msg: 'Der Wert stimmt noch nicht. Negative Zahlen in Klammern einsetzen und Punkt vor Strich.' };
}

    { n: 'K', given: 1, prompt: 'Bestimme die Menge.', show: M('K = B \\ C'), type: 'set', ans: [1, 2, 4, 6, 7] },
    { n: 'c1', lab: 'c', given: 1, prompt: 'Bestimme die Menge.', show: M('(A ∪ B) ∩ C'), type: 'set', ans: [3, 5, 8], tip: 'Die Klammer A ∪ B hast du schon als E ausgerechnet. Jetzt nur noch E ∩ C.' },
    { n: 'c2', lab: 'c', given: 1, prompt: 'Bestimme die Menge.', show: M('C \\ (A ∩ B)'), type: 'set', ans: [-10, 8, 9, 12], tip: 'A ∩ B ist deine Menge D. Wirf aus C alles raus, was in D liegt.' },
    { n: '2a', prompt: 'Gib die Menge aufzählend an.', show: M('A = {x | x ∈ ℤ ∧ x² ≤ 5,5}'), type: 'set', ans: [-2, -1, 0, 1, 2], tip: 'Probier ganze Zahlen ab 0 nach oben und nach unten. Minuszahlen nicht vergessen: (−2)² ist auch 4.' },
    { n: '2b', prompt: 'Gib die Menge aufzählend an.', show: M('B = {n | n ∈ ℕ ∧ n ist Teiler von 12}'), type: 'set', ans: [1, 2, 3, 4, 6, 12], tip: 'Teiler heißt: 12 / die Zahl geht glatt auf. Die 12 selbst zählt auch.' },
    { n: '2c', prompt: 'Gib die Menge aufzählend an.', show: M(']2; 5[ &nbsp; mit G = ℤ'), type: 'set', ans: [3, 4] },
    { n: '2d', prompt: 'Gib die Menge aufzählend an.', show: M(']−1; 3] &nbsp; mit G = ℤ'), type: 'set', ans: [0, 1, 2, 3] },
    { n: '2e', prompt: 'Gib die Menge aufzählend an.', show: M(']−3; 3[ &nbsp; mit G = ℤ'), type: 'set', ans: [-2, -1, 0, 1, 2] },

    { n: '3b', prompt: 'Schreib als Intervall, wenn das geht.', show: M('M = {x | x ∈ ℕ ∧ x ≤ 4}'), type: 'set', ans: [1, 2, 3, 4], alt: [0, 1, 2, 3, 4], tip: 'Falle. ℕ hat nur einzelne Zahlen, keinen durchgehenden Bereich. Ein Intervall passt hier nicht, also zählst du die Zahlen auf.', note: 'Ob die 0 zu ℕ gehört, wird unterschiedlich festgelegt. Beides gilt hier als richtig.' },
    { n: '3c', prompt: 'Schreib als Intervall.', show: M('M = {x | x ∈ ℝ ∧ −2 ≤ x ≤ 2}'), type: 'iv', ans: '[-2;2]' },

{ id: 'addsub', sheet: 'terme', title: 'Addition und Subtraktion', range: 'Aufgabe 1 bis 9', level: 'kurz', form: 'num', prompt: 'Löse die Klammern auf und rechne aus.',
  remind: ['Plus vor der Klammer lässt alles stehen, Minus dreht alles um.', 'Verschachtelte Klammern: innen anfangen.', 'Zusammenfassen nur Gleiches: x zu x, y zu y.', 'Negative Zahlen beim Einsetzen immer in Klammern.'],
  lesson: [
    { k: 'bild', b: '<p>Minus vor der Klammer ist wie das Umschalten der Radiuskorrektur von links auf rechts: Alles in der Klammer läuft gespiegelt, jedes Vorzeichen dreht sich um.</p>' },
    { k: 'begriff', h: 'Klammer auflösen', b: `<p>Klammer auflösen heißt: Die Klammer verschwindet, und du schreibst den Inhalt mit den richtigen Vorzeichen hin. ${M('7 − (2 − 5)')} wird zu ${M('7 − 2 + 5')}.</p>` },
    { k: 'merk', b: 'Plus vor der Klammer lässt alles stehen, Minus dreht alles um.' },
    { k: 'text', h: 'Verschachtelte Klammern', b: `<p>Wie bei russischen Puppen: Erst die kleinste, innerste Klammer aufmachen, dann nach außen arbeiten.</p><p>${M('100 − (−(30 − 8))')}: innen ${M('30 − 8 = 22')}, dann ${M('−(22) = −22')}, dann ${M('100 − (−22) = 122')}.</p>` },
    { k: 'begriff', h: 'Gleichartige Glieder', b: `<p>Zusammenfassen darfst du nur, was genau dieselben Buchstaben hat. ${M('3x + 5x = 8x')}, aber ${M('3x + 5y')} bleibt so stehen. Wie Schrauben zu Schrauben und Muttern zu Muttern.</p>` },
    { k: 'text', h: 'Werte einsetzen', b: `<p>Bei Aufgabe 6 bis 9 erst vereinfachen, dann einsetzen. Negative Zahlen kommen in Klammern: ${M('26,2y')} mit ${M('y = −1')} ist ${M('26,2 · (−1)')}.</p>` },
  ],
  vor: ['Innerste Klammer suchen.', 'Vorzeichen davor anschauen: Plus lässt stehen, Minus dreht um.', 'Gleiche Buchstaben sammeln und zusammenfassen.', 'Erst ganz am Ende die Zahlen einsetzen, negative in Klammern.'],
  kurz: 'Bei mehreren Minus vor Klammern: Minuszeichen zählen. Gerade Anzahl gibt plus, ungerade gibt minus. Und bei 6 bis 9 nie sofort einsetzen, erst vereinfachen, dann ist das Einsetzen eine kurze Rechnung.',
  hilfe: 'Schreib jede Zeile deiner Rechnung einzeln und tipp auf Zeile prüfen. Komma geht als Komma oder Punkt.',
  tasks: [
    { n: '1', raw: '216+(-45+17)', ans: '188' },
    { n: '2', raw: '216-(-45+17)', ans: '244' },
    { n: '3', raw: '216-(-(45-(17-(5+(2-4)))))', ans: '247', tip: 'Ganz innen: 2 − 4. Dann Schicht für Schicht nach außen.' },
    { n: '4', raw: '(-2567)-(225-13)-(-8-(-5+3))', ans: '-2773' },
    { n: '5', raw: '555-(-(57-78)-(78-57)+(-56+17)-(-(-13-11)))', ans: '618', tip: 'Rechne erst jede kleine Klammer in der großen Klammer einzeln aus, dann die große.' },
    { n: '6', form: 'simp', prompt: 'Löse die Klammern auf, fasse zusammen und setz dann ein.', raw: '17x-(-21y-4.3x)-(-5.7x-2.7y)-(-2.5y-2.1x)', ans: '29.1x+26.2y', val: { text: 'x = 1 und y = −2', ans: -23.3 } },
    { n: '7', form: 'simp', prompt: 'Löse die Klammern auf, fasse zusammen und setz dann ein.', raw: '5a-7b+15b-121-(81-16b)-(7b-5a)', ans: '10a+17b-202', val: { text: 'a = 12 und b = −11', ans: -269 } },
    { n: '8', form: 'simp', prompt: 'Löse die Klammern auf, fasse zusammen und setz dann ein.', raw: '7xy-(20x+12y)-(3xy+x)+5xy-(3.5xy-5.8xy)', ans: '11.3xy-21x-12y', val: { text: 'x = 1 und y = −1', ans: -20.3 }, tip: 'xy ist ein eigener Typ. xy darfst du nur mit xy zusammenfassen, nicht mit x oder y.' },
    { n: '9', form: 'simp', prompt: 'Löse die Klammern auf, fasse zusammen und setz dann ein.', raw: '3a-((-16x-17.5a)-6.5a-13x-(4a+0.3x))', ans: '29.3x+31a', val: { text: 'x = 3 und a = 7', ans: 304.9 }, tip: 'Erst die große Klammer innen fertig machen, dann das Minus davor anwenden.' },
  ] },

{ id: 'mult', sheet: 'terme', title: 'Multiplikation', range: 'Aufgabe 1 bis 20', level: 'kurz', form: 'simp', prompt: 'Multipliziere und vereinfache.',
  remind: ['Erst alle Zahlen zusammenrechnen, dann die Buchstaben alphabetisch anhängen, Brüche ganz am Schluss.', 'Minus zählen: gerade Anzahl gibt plus, ungerade gibt minus.', 'Ab Aufgabe 13: Punkt vor Strich. Jedes Produkt einzeln, dann zusammenfassen.', 'Gemischte Zahl umwandeln: Ganze · Nenner + Zähler.'],
  lesson: [
    { k: 'bild', b: '<p>Wie eine Stückliste sortieren: erst alle Zahlen auf einen Haufen, dann alle Buchstaben alphabetisch dahinter.</p>' },
    { k: 'begriff', h: 'Produkt und Faktoren', b: `<p>Ein <b>Produkt</b> ist eine Mal-Rechnung. Die einzelnen Teile heißen <b>Faktoren</b>. Beim Mal darfst du tauschen, das ist das Kommutativgesetz. Deshalb darfst du alles umsortieren.</p>` },
    { k: 'merk', b: 'Kommutativ, Reihenfolge relativ. Minus zählen: gerade Anzahl gibt plus, ungerade gibt minus.' },
    { k: 'text', h: 'Gemischte Zahlen', b: `<p>${MX(3, 1, 4)} heißt 3 Ganze und ein Viertel. Umwandeln: Ganze · Nenner + Zähler, also ${M('3 · 4 + 1 = 13')}. Ergibt ${F(13, 4)}.</p>` },
    { k: 'text', h: 'Kommazahlen', b: '<p>Bei Kommazahlen darfst du den Taschenrechner nehmen. Das Vorzeichen klärst du vorher im Kopf, dann tippst du nur noch Zahlen ohne Minus.</p>' },
  ],
  vor: ['Minuszeichen zählen und das Vorzeichen festlegen.', 'Alle Zahlen ohne Minus malnehmen, gern mit dem Rechner.', 'Buchstaben alphabetisch dahinter, gleiche Buchstaben als Potenz.', 'Steht Plus oder Minus dazwischen: erst jedes Produkt einzeln, dann gleiche Buchstaben zusammenfassen.'],
  kurz: 'Erst nach Paaren suchen, die glatt werden. Ein Bruch und sein Kehrwert ergeben 1, zum Beispiel 3/4 · 4/3. Brüche ganz am Schluss, oft kürzen die sich fast komplett weg.',
  hilfe: 'Eine Bruchzahl vor Buchstaben in Klammern setzen, zum Beispiel (13/3)a. Ohne Klammer liest die App 13/3a als 13 / 3a.',
  tasks: [
    { n: '1', raw: '3a*5c*2b', ans: '30abc' },
    { n: '2', raw: '3ab*11*7c', ans: '231abc' },
    { n: '3', raw: '4ab*5m*(1/3)n', show: P('4ab*5m') + op('·') + F(1, 3) + M('n'), ans: '(20/3)abmn', tip: 'Den Bruch einfach als 1 / 3 mitnehmen: erst 4 · 5 = 20, dann durch 3.' },
    { n: '4', raw: '7.5ab*2c', ans: '15abc' },
    { n: '5', raw: '3*2.5a+7.5a', ans: '15a' },
    { n: '6', raw: '2.4a*0.4x-1.5x*2a', ans: '-2.04ax' },
    { n: '7', raw: '4.5ax*2.3+3a*3.5*2x', ans: '31.35ax' },
    { n: '8', raw: '3*2.7abx-1.5x*9a*b', ans: '-5.4abx' },
    { n: '9', raw: '(-3x)*(-a)*(-2)', ans: '-6ax' },
    { n: '10', raw: '(-3.2a)*(-1.7b)', ans: '5.44ab' },
    { n: '11', raw: '14a*(-71b)*(-c)', ans: '994abc' },
    { n: '12', raw: '2x*5y*(-7az)*(-2)', ans: '140axyz' },
    { n: '13', raw: '(-a)(-0.7b)(-1.4)-(-3.2a)(-0.8)*1.6b', ans: '-5.076ab' },
    { n: '14', raw: '(-1.9p)(-1.8q)*2-(2.7pq)(-3)+0.4(-p)(-q)', ans: '15.34pq' },
    { n: '15', raw: '0.5(-0.7x)*4-(0.6x)(-1.2)+3x(-1.4)', ans: '-4.88x' },
    { n: '16', raw: '5(-1.3m)(2.3n)x+(-1.9mx)(3.2n)(-4.3)', ans: '11.194mnx' },
    { n: '17', raw: '0.5a*2.5b(-c)+7.5c*2b(-5)(-3a)-2a*3bc', ans: '217.75abc' },
    { n: '18', raw: '13.5xy+(-6.5x)(-2y)+(-13y)*1.2x*0.5', ans: '18.7xy' },
    { n: '19', raw: '-(-(7/3))*a*(c/2)*(13/4)-1.3c(-4.2a)(-1/2)*(1.2)', tol: 2e-3,
      show: M('−(−') + MX(2, 1, 3) + M(') · a · ') + F('c', 2) + op('·') + MX(3, 1, 4) + M(' − 1,3c(−4,2a)(−') + F(1, 2) + M(') · (1,2)'),
      ans: '0.5157ac', tip: 'Gemischte Zahlen zuerst umwandeln: 2 1/3 = 7/3 und 3 1/4 = 13/4. Gerundet auf 4 Stellen reicht.' },
    { n: '20', raw: '(5/3)x(-4.5y)(-1.5)(-3)(2/15)+7.4xy(-24/7)(-7/2)(1/12)',
      show: MX(1, 2, 3) + M('x(−4,5y)(−1,5)(−3)') + F(2, 15) + M(' + 7,4xy(−') + MX(3, 3, 7) + M(')(−') + F(7, 2) + M(')') + F(1, 12),
      ans: '2.9xy', tip: 'Im zweiten Teil: 3 3/7 = 24/7. Schau, was 24/7 · 7/2 · 1/12 ergibt, bevor du den Rechner nimmst.' },

{ id: 'summen', sheet: 'terme', title: 'Multiplikation mit Summentermen', range: 'Aufgabe 21 bis 45', level: 'kurz', form: 'simp', prompt: 'Multipliziere aus und fasse zusammen.',
  remind: ['Paketbote bringt Butterbrötchen, jeder in der Klammer kriegt eins.', 'Klammer · Klammer: jeder mit jedem.', 'Minus vor dem Faktor: jedes Vorzeichen in der Klammer dreht sich.'],
  lesson: [
    { k: 'bild', b: '<p>Der Paketbote vor der Klammer bringt Butterbrötchen. Jeder in der Klammer kriegt eins, keiner wird vergessen.</p>' },
    { k: 'begriff', h: 'Distributivgesetz', b: `<p>Distributiv heißt verteilen. ${M('a · (b + c) = a · b + a · c')}. Das nennt man <b>ausmultiplizieren</b>.</p>` },
    { k: 'merk', b: 'Paketbote bringt Butterbrötchen, jeder in der Klammer kriegt eins.' },
    { k: 'text', h: 'Klammer · Klammer', b: `<p>Zwei Werkzeuge an zwei Werkstoffen testen sind vier Versuche. Jedes Glied der ersten Klammer trifft jedes Glied der zweiten.</p><p>${M('(x + 3)(x − 5)')}: ${M('x · x = x²')}, ${M('x · (−5) = −5x')}, ${M('3 · x = 3x')}, ${M('3 · (−5) = −15')}. Zusammen ${M('x² − 2x − 15')}.</p>` },
    { k: 'merk', b: 'Jeder mit jedem, dann zusammenfassen.' },
  ],
  vor: ['Faktor vor der Klammer an jedes Glied in der Klammer verteilen.', 'Klammer · Klammer: erstes Glied links · jedes rechts, dann zweites Glied links · jedes rechts.', 'Vorzeichen bei jedem Produkt einzeln: minus mal minus gibt plus.', 'Gleiche Buchstaben zusammenfassen.'],
  kurz: 'Vorher Produkte abzählen: 2 Glieder · 3 Glieder sind 6 Produkte. Hast du am Ende weniger, fehlt eins. Ist der Faktor negativ, dreh zuerst alle Vorzeichen in der Klammer um und rechne dann nur noch ohne Minus.',
  hilfe: 'Eine Bruchzahl vor Buchstaben in Klammern setzen, zum Beispiel (13/3)a.',
  tasks: [
    { n: '21', raw: '5(a-b)', ans: '5a-5b' },
    { n: '22', raw: '7(x-2)', ans: '7x-14' },
    { n: '23', raw: '(2x-3y)5', ans: '10x-15y' },
    { n: '24', raw: '-3(b-a)', ans: '3a-3b' },
    { n: '25', raw: '3a(x-y+z)(-1)', ans: '-3ax+3ay-3az', note: 'Auf dem Lösungsblatt steht bei 25 ein anderes Ergebnis. Da hat sich ein Druckfehler eingeschlichen, das hier ist richtig.' },
    { n: '26', raw: '6a(7c-3b-0.5)', ans: '42ac-18ab-3a' },
    { n: '27', raw: '(13/3)(3b-a)', show: MX(4, 1, 3) + M('(3b − a)'), ans: '13b-(13/3)a', tip: 'Erst umwandeln: 4 1/3 = 13/3.' },
    { n: '28', raw: '(-2ab)(7y-5x)', ans: '10abx-14aby' },
    { n: '29', raw: '(-x)(4y+a-3)(-1)', ans: '4xy+ax-3x', tip: 'Zwei Minus vorne: (−x) · (−1) ist einfach x.' },
    { n: '30', raw: '4(y-x)+5x', ans: 'x+4y' },
    { n: '31', raw: '3a(4a-7b)-5b(b-4a)', ans: '12a^2-ab-5b^2' },
    { n: '32', raw: '4a^2+3b(b-a)+6b(b-9a)', ans: '4a^2-57ab+9b^2' },
    { n: '33', raw: '(-1.7)(2a-4b+c)+(b-a-c)(-2.5)', ans: '-0.9a+4.3b+0.8c' },
    { n: '34', raw: '(x+1-y)(-3.2z)-(-1.8z)(y-2x-3)', ans: '5yz-6.8xz-8.6z' },
    { n: '35', raw: '(-1.2)(7.3c-9.4a+11b)-(b-2.5a-c)(-1.3)', ans: '8.03a-11.9b-10.06c' },
    { n: '36', raw: '(a+b)(c-2)', ans: 'ac-2a+bc-2b' },
    { n: '37', raw: '(x-4)(y-2)', ans: 'xy-2x-4y+8' },
    { n: '38', raw: '(a-2b)(2-2c)', ans: '2a-2ac-4b+4bc' },
    { n: '39', raw: '(2a-2b)(2x-y)', ans: '4ax-2ay-4bx+2by' },
    { n: '40', raw: '(3a-b)(2x-y)', ans: '6ax-3ay-2bx+by' },
    { n: '41', raw: '(a-b)(2x-3y)', ans: '2ax-3ay-2bx+3by' },
    { n: '42', raw: '(m+n)(a-b+2c)', ans: 'am-bm+2cm+an-bn+2cn' },
    { n: '43', raw: '(m-c+n)(2-x)(-2)', ans: '2mx+2nx-2cx-4m+4c-4n', tip: 'Erst die einfachste Mal-Rechnung: (2 − x) · (−2) gibt −4 + 2x. Dann mit der ersten Klammer.' },
    { n: '44', raw: '(a-b+c)(x+y-1)', ans: 'ax+ay-a-bx-by+b+cx+cy-c', tip: '3 · 3 Glieder sind 9 Produkte. Zähl am Ende nach.' },
    { n: '45', raw: '3ax(1-c)(4-3d)', ans: '12ax-12acx-9adx+9acdx', tip: 'Erst (1 − c)(4 − 3d) jeder mit jedem, dann alles · 3ax.' },
  ] },

{ id: 'binom', sheet: 'terme', title: 'Binomische Formeln', range: 'Aufgabe 46 bis 80', level: 'voll', form: 'simp', prompt: 'Löse auf und fasse zusammen.',
  lesson: [
    { k: 'bild', b: `${SVG_BINOM}<p>Eine quadratische Platte mit Seite a + b. Säg sie auf: ein großes Quadrat a · a, ein kleines b · b und zwei gleiche Streifen a · b. Zusammen ${M('a² + 2ab + b²')}. Daher kommt die Mitte.</p>` },
    { k: 'begriff', h: 'Binom', b: `<p>Bi heißt zwei, wie beim Bicycle mit zwei Rädern. Ein <b>Binom</b> ist eine Klammer mit zwei Gliedern, zum Beispiel ${M('(a + b)')}. Hoch 2 heißt: die Klammer mal sich selbst, ${M('(a + b) · (a + b)')}. Die binomischen Formeln sind Abkürzungen dafür.</p>` },
    { k: 'begriff', h: 'Erste binomische Formel', b: `<p class="expr" style="font-size:20px">${M('(a + b)² = a² + 2ab + b²')}</p>` },
    { k: 'merk', b: 'Erster zum Quadrat, zweimal Erster · Zweiter, Zweiter zum Quadrat.' },
    { k: 'begriff', h: 'Zweite binomische Formel', b: `<p class="expr" style="font-size:20px">${M('(a − b)² = a² − 2ab + b²')}</p><p>Nur die Mitte wird minus. Hinten steht immer plus, denn ein Quadrat ist nie negativ: ${M('(−b)² = b²')}.</p>` },
    { k: 'merk', b: 'Minus in der Klammer, Minus in der Mitte, hinten immer plus.' },
    { k: 'begriff', h: 'Dritte binomische Formel', b: `<p class="expr" style="font-size:20px">${M('(a + b)(a − b) = a² − b²')}</p><p>Die Mitte fällt weg, weil ${M('+ab')} und ${M('−ab')} sich gegenseitig aufheben.</p>` },
    { k: 'merk', b: 'Plus-Minus-Paar: Mitte weg, Minus bleibt.' },
    { k: 'text', h: 'Fehler Nummer eins', b: `<p>${M('(a + b)²')} ist nicht ${M('a² + b²')}. Mit Zahlen: ${M('(3 + 4)² = 49')}, aber ${M('3² + 4² = 25')}. Die fehlenden 24 sind genau ${M('2 · 3 · 4')}, die Mitte.</p>` },
    { k: 'bsp', h: 'Beispiel', b: `<p>${M('(3x + 2)²')}, erste Formel. a ist ${M('3x')}, b ist ${M('2')}.</p><p>${M('a² = (3x)² = 9x²')}. Die 3 wird mit quadriert!</p><p>${M('2ab = 2 · 3x · 2 = 12x')}</p><p>${M('b² = 4')}</p><p>Ergebnis ${M('9x² + 12x + 4')}</p>` },
    { k: 'text', h: 'Drei Glieder, Aufgabe 56 bis 60', b: `<p>${M('(a + b + c)²')}: alle drei zum Quadrat, dazu zweimal jedes Paar: ${M('a² + b² + c² + 2ab + 2ac + 2bc')}.</p><p>Bei Minus gilt für jedes Paar: Vorzeichen · Vorzeichen. Steht vor b ein Minus und vor c ein Plus, wird ${M('2bc')} minus.</p>` },
    { k: 'text', h: 'Gemischte Aufgaben, 68 und 72 bis 80', b: `<p>Formel auflösen und das Ergebnis in Klammern lassen, wenn ein Minus davor steht. Erst dann die Klammer auflösen.</p><p>${M('(x − 1)(x + 1) − (x + 1)²')} wird zu ${M('(x² − 1) − (x² + 2x + 1)')}.</p><p>Vertauschte Reihenfolge stört nicht: ${M('2 + x')} ist dasselbe wie ${M('x + 2')}.</p>` },
  ],
  vor: ['Welche Formel? Plus, Minus oder Plus-Minus-Paar.', 'a und b bestimmen, mit der Zahl davor: in (4s − 3r)² ist a = 4s und b = 3r.', 'a², 2ab und b² einzeln ausrechnen.', 'Mit dem richtigen Vorzeichen zusammensetzen.', 'Stehen mehrere Teile da: jede Formel einzeln auflösen und das Ergebnis in Klammern schreiben. Ein Minus vor der Klammer dreht alles darin um. Zum Schluss gleiche Sorten sammeln, also alle x², alle x und alle Zahlen, und jede Sorte einzeln zusammenrechnen.'],
  kurz: 'Die Mitte im Kopf: 2 · vordere Zahl · hintere Zahl. Bei (6x − 1)² ist das 2 · 6 · 1 = 12, also −12x. Beim Plus-Minus-Paar gar nicht ausmultiplizieren: (3m − 4)(3m + 4) ist sofort 9m² − 16.',
  hilfe: 'Hoch 2 mit der Taste ² eingeben. Eine Bruchzahl vor Buchstaben in Klammern, zum Beispiel (1/16)u².',
  tasks: [
    { n: '46', raw: '(m+n)^2', ans: 'm^2+2mn+n^2', tip: 'Plus in der Klammer und ², also die 1. Formel. a ist m, b ist n. Rechne a², dann 2 · a · b, dann b² und schreib alles mit Plus hintereinander.' },
    { n: '47', raw: '(n-1)^2', ans: 'n^2-2n+1', tip: 'Minus in der Klammer und ², also die 2. Formel. a ist n, b ist 1. Rechne n², dann 2 · n · 1 mit Minus davor, dann 1² mit Plus.' },
    { n: '48', raw: '(a+4)^2', ans: 'a^2+8a+16', tip: '1. Formel. a ist a, b ist 4. Die Mitte ist 2 · a · 4. Hinten steht 4².' },
    { n: '49', raw: '(r+1)^2', ans: 'r^2+2r+1', tip: '1. Formel. a ist r, b ist 1. Schreib auch 2 · r · 1 und 1² hin, die 1 darf nicht verschwinden.' },
    { n: '50', raw: '(a-c)^2', ans: 'a^2-2ac+c^2', tip: '2. Formel. a ist a, b ist c. Die Mitte ist 2 · a · c mit Minus, hinten c² mit Plus.' },
    { n: '51', raw: '(1-4x)^2', ans: '1-8x+16x^2', tip: '2. Formel. a ist 1, b ist 4x. Bei b² wird die 4 mit quadriert: (4x)² ist 4² · x².' },
    { n: '52', raw: '(4s-3r)^2', ans: '16s^2-24rs+9r^2', tip: '2. Formel. a ist 4s, b ist 3r. Bei a² und b² Zahl und Buchstabe quadrieren. Die Mitte: 2 · 4 · 3, dahinter r und s.' },
    { n: '53', raw: '(5x-1)^2', ans: '25x^2-10x+1', tip: '2. Formel. a ist 5x, b ist 1. (5x)² heißt 5² · x². Die Mitte ist 2 · 5x · 1.' },
    { n: '54', raw: '(3x+0.5y)^2', ans: '9x^2+3xy+0.25y^2', tip: '1. Formel. a ist 3x, b ist 0,5y. Rechne 3², 2 · 3 · 0,5 und 0,5². Kommazahlen darfst du mit dem Rechner rechnen.' },
    { n: '55', raw: '(0.25u-2v)^2', ans: '0.0625u^2-uv+4v^2', note: 'Auf dem Blatt steht u²/16. Das ist dasselbe wie 0,0625u².', tip: '2. Formel. a ist 0,25u, b ist 2v. Rechne 0,25², 2 · 0,25 · 2 und 2². Die Mitte wird eine 1, dann schreibst du nur uv.' },
    { n: '56', raw: '(a-b+c)^2', ans: 'a^2+b^2+c^2-2ab+2ac-2bc', tip: 'Drei Glieder: a, −b und c. Erst alle drei zum Quadrat, das ist immer plus. Dann zweimal jedes Paar, Vorzeichen · Vorzeichen: a mit −b gibt minus, a mit c gibt plus, −b mit c gibt minus.' },
    { n: '57', raw: '(a+b+c)^2', ans: 'a^2+b^2+c^2+2ab+2ac+2bc', tip: 'Drei Glieder: a, b und c. Erst alle drei zum Quadrat. Dann zweimal jedes Paar: 2ab, 2ac und 2bc. Hier ist alles plus.' },
    { n: '58', raw: '(a-b-c)^2', ans: 'a^2+b^2+c^2-2ab-2ac+2bc', tip: 'Paar b und c: minus mal minus gibt plus.' },
    { n: '59', raw: '(a-b-1)^2', ans: 'a^2+b^2-2ab-2a+2b+1', tip: 'Drei Glieder: a, −b und −1. Alle Quadrate sind plus. Dann jedes Paar zweimal, Vorzeichen · Vorzeichen: a mit −b gibt minus, a mit −1 gibt minus, −b mit −1 gibt plus.' },
    { n: '60', raw: '(p+2-q)^2', ans: 'p^2+q^2+4p-2pq-4q+4', tip: 'Drei Glieder: p, +2 und −q. Alle Quadrate sind plus. Paare zweimal nehmen: p mit 2 ist plus, p mit −q ist minus, 2 mit −q ist minus.' },
    { n: '61', raw: '(2.5x-0.7y)^2', ans: '6.25x^2-3.5xy+0.49y^2', tip: '2. Formel. a ist 2,5x, b ist 0,7y. Rechne 2,5², 2 · 2,5 · 0,7 und 0,7² mit dem Rechner, die Buchstaben schreibst du dahinter.' },
    { n: '62', raw: '(1.3a+2.6b)^2', ans: '1.69a^2+6.76ab+6.76b^2', tip: '1. Formel. a ist 1,3a, b ist 2,6b. Rechne 1,3², 2 · 1,3 · 2,6 und 2,6² mit dem Rechner.' },
    { n: '63', raw: '(0.2a-0.1b)^2', ans: '0.04a^2-0.04ab+0.01b^2', tip: '2. Formel. a ist 0,2a, b ist 0,1b. Rechne 0,2², 2 · 0,2 · 0,1 und 0,1². Achte auf die Nullen hinter dem Komma.' },
    { n: '64', raw: '(a-3)(a+3)', ans: 'a^2-9', tip: 'Zwei Klammern mit gleichen Gliedern, einmal Plus, einmal Minus: die 3. Formel. Nur a² − b², es gibt keine Mitte.' },
    { n: '65', raw: '(1+y)(1-y)', ans: '1-y^2', tip: '3. Formel. a ist 1, b ist y. Das Ergebnis hat nur zwei Glieder.' },
    { n: '66', raw: '(3x+2y)(3x-2y)', ans: '9x^2-4y^2', tip: '3. Formel. a ist 3x, b ist 2y. Beide quadrieren, dazwischen minus.' },
    { n: '67', raw: '(4m-5)(4m+5)', ans: '16m^2-25', tip: '3. Formel. Dass Minus vor Plus kommt, ist egal. a ist 4m, b ist 5.' },
    { n: '68', raw: '2(a-b)(2a+2b)', ans: '4a^2-4b^2', tip: 'Aus (2a + 2b) die 2 ausklammern: 2(a + b). Dann steht da 2 · 2 · (a − b)(a + b).' },
    { n: '69', raw: '(x-2)(2+x)', ans: 'x^2-4', tip: '2 + x ist dasselbe wie x + 2. Also die 3. Formel mit a gleich x und b gleich 2.' },
    { n: '70', raw: '(5x-2y)(5x+2y)', ans: '25x^2-4y^2', tip: '3. Formel. a ist 5x, b ist 2y.' },
    { n: '71', raw: '(1.3-x)(x+1.3)', ans: '1.69-x^2', tip: 'x + 1,3 ist dasselbe wie 1,3 + x. Also die 3. Formel mit a gleich 1,3 und b gleich x.' },
    { n: '72', raw: '(-2-x)(x+2)(-1)', ans: 'x^2+4x+4', tip: '(−2 − x) · (−1) ist (2 + x). Was steht dann da?' },
    { n: '73', raw: '(a-2b)(2b+a)', ans: 'a^2-4b^2', tip: '2b + a ist dasselbe wie a + 2b. Also die 3. Formel mit a gleich a und b gleich 2b. Denk an (2b)² = 4b².' },
    { n: '74', raw: '(3x-2y)(-2y+3x)', ans: '9x^2-12xy+4y^2', tip: 'Schau genau: −2y + 3x ist dasselbe wie 3x − 2y.' },
    { n: '75', raw: '(1-a+b)(1+a+b)', ans: 'b^2-a^2+2b+1', tip: 'Fass 1 + b als ein Stück zusammen: ((1 + b) − a)((1 + b) + a). Plus-Minus-Paar.' },
    { n: '76', raw: '(a-b)^2-(a+2b)^2', ans: '-6ab-3b^2', tip: 'So gehst du vor:\nVorne (a − b)² mit der 2. Formel auflösen.\nHinten (a + 2b)² mit der 1. Formel auflösen und das Ergebnis in Klammern lassen, weil ein Minus davor steht.\nDas Minus vor der Klammer dreht jedes Vorzeichen in der Klammer um.\nGleiche Sorten sammeln: a² mit a², ab mit ab, b² mit b². Jede Sorte einzeln zusammenrechnen.' },
    { n: '77', raw: '(x-1)(x+1)-(x+1)^2', ans: '-2x-2', tip: 'So gehst du vor:\nVorne die 3. Formel: (x − 1)(x + 1) wird x² − 1.\nHinten die 1. Formel, Ergebnis in Klammern: (x² + 2x + 1).\nDas Minus vor der Klammer dreht alles um.\nGleiche Sorten sammeln: x² mit x², x mit x, Zahlen mit Zahlen.' },
    { n: '78', raw: '(p-5q)^2-10pq+(p+5q)^2', ans: '2p^2-10pq+50q^2', tip: 'So gehst du vor:\nVorne (p − 5q)² mit der 2. Formel, hinten (p + 5q)² mit der 1. Formel auflösen. Beide Ergebnisse in Klammern schreiben.\nVor der zweiten Klammer steht Plus, da ändert sich nichts.\nGleiche Sorten sammeln: alle p², alle pq, alle q². Das −10pq in der Mitte der Aufgabe nicht vergessen.' },
    { n: '79', raw: '(x-1)(y+1)-xy+2x-5(y-1)', ans: '3x-6y+4', tip: 'Hier steckt keine binomische Formel drin.\n(x − 1)(y + 1) jeder mit jedem malnehmen, das gibt 4 Glieder.\n−5(y − 1): die −5 mit beiden Gliedern malnehmen, mit Vorzeichen.\nGleiche Sorten sammeln: xy, x, y und Zahlen.' },
    { n: '80', raw: '(0.9x-0.3)(0.3-0.9x)+9(0.3x+0.1)^2', ans: '1.08x', tip: 'So gehst du vor:\n(0,3 − 0,9x) ist −(0,9x − 0,3). Der erste Teil ist also −(0,9x − 0,3)², eine 2. Formel mit Minus davor.\nHinten erst (0,3x + 0,1)² mit der 1. Formel auflösen, dann alles · 9.\nVorne die Klammer mit dem Minus auflösen, das dreht alles um.\nGleiche Sorten sammeln: x² mit x², x mit x, Zahlen mit Zahlen. Viel hebt sich weg.' },
  ] },

{ id: 'faktor', sheet: 'terme', title: 'Zerlegung in Faktoren', range: 'Aufgabe 1 bis 48', level: 'voll', form: 'fac', prompt: 'Zerlege in Faktoren, also ausklammern.',
  lesson: [
    { k: 'bild', b: '<p>Beim Ausmultiplizieren verteilt der Paketbote Butterbrötchen an jeden in der Klammer. Beim Ausklammern sammelst du sie wieder ein: Was jeder hat, kommt einmal vor die Klammer.</p>' },
    { k: 'begriff', h: 'Faktorisieren', b: `<p>Faktorisieren oder Ausklammern heißt: aus einer Plus-Minus-Rechnung eine Mal-Rechnung machen. Aus ${M('6ab + 9ac')} wird ${M('3a(2b + 3c)')}. Faktor heißt einfach Mal-Teil.</p>` },
    { k: 'merk', b: 'Was alle haben, kommt nach vorn. Was übrig bleibt, kommt in die Klammer.' },
    { k: 'bsp', h: 'Beispiel Schritt für Schritt', b: `<p>${M('6ab + 9ac')}</p><p>Größte Zahl, durch die 6 und 9 teilbar sind: 3. Das nennt man <b>ggT</b>, größter gemeinsamer Teiler.</p><p>Buchstabe, den beide haben: a.</p><p>Jedes Glied durch 3a teilen: ${M('6ab : 3a = 2b')} und ${M('9ac : 3a = 3c')}.</p><p>Ergebnis ${M('3a(2b + 3c)')}. Probe: wieder ausmultiplizieren, dann muss die Aufgabe rauskommen.</p>` },
    { k: 'text', h: 'Zahlenaufgaben 1 bis 5', b: `<p>So wie das rote Beispiel auf deinem Blatt: In jedem Glied steckt dieselbe Zahl. Die kommt raus, der Rest wird ganz einfaches Kopfrechnen.</p>` },
    { k: 'text', h: 'Eine ganze Klammer als Faktor, 13 bis 25', b: `<p>Tu so, als wäre die Klammer ein einziger Buchstabe K. ${M('(p + q) · 3 + (p + q) · r')} ist wie ${M('K · 3 + K · r = K(3 + r)')}, also ${M('(p + q)(3 + r)')}.</p>` },
    { k: 'merk', b: 'Wo nichts übrig bleibt, steht eine 1. Aus (p − q) · 5 + p − q wird (p − q)(5 + 1).' },
    { k: 'text', h: 'Vorzeichen-Trick', b: `<p>${M('−p + q')} ist dasselbe wie ${M('−(p − q)')}. Damit machst du aus zwei verschiedenen Klammern eine gemeinsame.</p>` },
    { k: 'text', h: 'Gruppieren, ab Aufgabe 26', b: `<p>Haben nicht alle Glieder etwas gemeinsam, bildest du Paare. ${M('px + py + qx + qy')}: Aus den ersten beiden p raus, aus den letzten beiden q raus: ${M('p(x + y) + q(x + y)')}. Jetzt haben beide ${M('(x + y)')}, das kommt raus: ${M('(x + y)(p + q)')}.</p>` },
  ],
  vor: ['Größte gemeinsame Zahl suchen.', 'Gemeinsame Buchstaben oder gemeinsame Klammer suchen.', 'Haben nicht alle was gemeinsam: Paare bilden und paarweise ausklammern.', 'Jedes Glied durch das Ausgeklammerte teilen, der Rest kommt in die Klammer.', 'Probe: im Kopf wieder ausmultiplizieren.'],
  kurz: 'Die kleinste Zahl im Term zuerst testen: Geht sie in alle anderen, ist sie meist schon der ggT. Bei Paaren: Passen die Klammern nach dem ersten Ausklammern nicht zusammen, nimm beim zweiten Paar ein Minus mit raus oder bilde andere Paare.',
  hilfe: 'Gib das Ergebnis als Mal-Rechnung ein, zum Beispiel 3a(2b+3c) oder (a+b)(x+y). Bei 1 bis 5 reicht am Ende die Zahl.',
  tasks: [
    { n: '1', form: 'num', raw: '5*12+4*12-2*12', ans: '84', blatt: M('12 · (5 + 4 − 2) = 7 · 12 = 84'), prompt: 'Klammere aus und rechne dann aus.' },
    { n: '2', form: 'num', raw: '25*11+15*25-2*25', ans: '600', blatt: M('25 · 24 = 600'), prompt: 'Klammere aus und rechne dann aus.' },
    { n: '3', form: 'num', raw: '3*15*8+5*15*8-2*15*8', ans: '720', blatt: M('6 · 15 · 8 = 720'), prompt: 'Klammere aus und rechne dann aus.' },
    { n: '4', form: 'num', raw: '19*3.2*4.3+5*3.2*4.3-20*4.3*3.2', ans: '55.04', blatt: M('4 · 3,2 · 4,3 = 55,04'), prompt: 'Klammere aus und rechne dann aus.' },
    { n: '5', form: 'num', raw: '(1/3)*25*2.4+(5/2)*25*2.4+(1/6)*2.4*25', ans: '180', blatt: M('3 · 25 · 2,4 = 180'), prompt: 'Klammere aus und rechne dann aus.',
      show: F(1, 3) + M(' · 25 · 2,4 + ') + MX(2, 1, 2) + M(' · 25 · 2,4 + ') + F(1, 6) + M(' · 2,4 · 25'), tip: '25 · 2,4 steckt überall drin. In der Klammer bleiben drei Brüche: 1/3 + 5/2 + 1/6. Hauptnenner 6.' },
    { n: '6', raw: 'bx-b', ans: 'b(x-1)', tip: 'Das hintere b ist b · 1.' },
    { n: '7', raw: 'ax-4az+5ay', ans: 'a(x+5y-4z)' },
    { n: '8', raw: '21abx-6by+15bz', ans: '3b(7ax-2y+5z)' },
    { n: '9', raw: '24ab-12bc+48ab', ans: '12b(6a-c)', tip: 'Erst zusammenfassen: 24ab und 48ab sind gleichartig.' },
    { n: '10', form: 'fos', raw: '5bx-bx-15bx', ans: '-11bx', blatt: M('bx(5 − 1 − 15) = −11bx') },
    { n: '11', raw: '25ab+125ac+75ax', ans: '25a(b+5c+3x)' },
    { n: '12', raw: 'am+bm-cm+xm', ans: 'm(a+b-c+x)' },
    { n: '13', raw: '(a+b)*n+(a+b)*m', ans: '(a+b)(n+m)' },
    { n: '14', raw: '(a-b)*x+(a-b)*y', ans: '(a-b)(x+y)' },
    { n: '15', raw: '(b-c)*z+b-c', ans: '(b-c)(z+1)', tip: 'Das hintere b − c ist 1 · (b − c).' },
    { n: '16', raw: 'm+n+x*(m+n)', ans: '(m+n)(1+x)' },
    { n: '17', raw: '(4n+3m)*b+4n+3m', ans: '(4n+3m)(b+1)' },
    { n: '18', raw: 'a*(x+y)*b-x-y', ans: '(x+y)(ab-1)', tip: '−x − y ist −(x + y), also −1 · (x + y).' },
    { n: '19', raw: '3x*(a-b)-a+b', ans: '(a-b)(3x-1)', tip: '−a + b ist −(a − b).' },
    { n: '20', raw: '(c+3d)*4a-c-3d', ans: '(c+3d)(4a-1)' },
    { n: '21', raw: '(4a-2b)*(x+y)-(3a+4b)*(x+y)', ans: '(x+y)(a-6b)', tip: '(x + y) raus. In die Klammer kommt (4a − 2b) − (3a + 4b). Minus dreht um.' },
    { n: '22', raw: '(5m+2n)*(x-y)+(3m+2n)*(x-y)', ans: '4(x-y)(2m+n)', blatt: M('(x − y)(8m + 4n) = (x − y)(2m + n) · 4'), note: 'Aus 8m + 4n kann noch die 4 raus. Darum will die App die 4 auch vorn sehen.' },
    { n: '23', raw: '(15xy+12bx)*(a-c)-(5bx+10xy)*(a-c)', ans: '(a-c)(5y+7b)x' },
    { n: '24', raw: '6*(3x-5y)-(3x-5y)*(5-3a)-2*(3x-5y)*a', ans: '(3x-5y)(1+a)' },
    { n: '25', raw: '2n*(3x+z)-(2n+3)*(3x+z)-3x-z', ans: '(3x+z)(-4)', tip: '−3x − z ist −1 · (3x + z). Dann in der Klammer: 2n − (2n + 3) − 1.' },
    { n: '26', raw: 'ax-bx+ay-by', ans: '(a-b)(x+y)' },
    { n: '27', raw: 'mx+my-nx-ny', ans: '(x+y)(m-n)', tip: 'Beim zweiten Paar −n rausziehen: −n(x + y).' },
    { n: '28', raw: 'axnd-axnc+abnd-abnc', ans: '(d-c)(x+b)an', tip: 'Erst an aus allen vier raus. Dann in der Klammer Paare bilden.' },
    { n: '29', raw: '2ax+2ay+3bx+3by', ans: '(x+y)(2a+3b)' },
    { n: '30', raw: '6bd+2bn+3dc+nc', ans: '(3d+n)(2b+c)' },
    { n: '31', raw: '2ax+ay+az-2bx-by-bz', ans: '(2x+y+z)(a-b)', tip: 'Zwei Dreiergruppen: die ersten drei haben a, die letzten drei haben −b.' },
    { n: '32', raw: '2ax-2ay+bx-by-cx+cy', ans: '(x-y)(2a+b-c)', tip: 'Drei Paare. Beim letzten Paar −c rausziehen.' },
    { n: '33', raw: '2dx+2ax+2nx-dy-ay-ny', ans: '(2x-y)(d+a+n)' },
    { n: '37', raw: '57xy+19ax-38xz', ans: '19x(3y+a-2z)', tip: '57 und 38 sind beide Vielfache von 19.' },
    { n: '38', raw: '77ab+28ad-84ac-91ah', ans: '7a(11b+4d-12c-13h)' },
    { n: '39', raw: '6x(2a-3b)-5y(2a-3b)-4x(2a-3b)', ans: '(2a-3b)(2x-5y)' },
    { n: '40a', raw: 'ax+bx+ay+by', ans: '(a+b)(x+y)' },
    { n: '40b', raw: 'ab-cb-ad+cd', ans: '(a-c)(b-d)' },
    { n: '41', raw: '7(2x-3y)+7a(2x-3y)-8b(2x-3y)', ans: '(2x-3y)(7+7a-8b)' },
    { n: '42', raw: '(2a+3b)*(4-y)-(2a+3b)*(3y+5)', ans: '(2a+3b)(4y+1)(-1)' },
    { n: '43a', raw: 'xy-x-y+1', ans: '(y-1)(x-1)', tip: 'Paare: xy − x und −y + 1. Beim zweiten Paar −1 rausziehen.' },
    { n: '43b', raw: '3ab-a-3b+1', ans: '(3b-1)(a-1)' },
    { n: '44', raw: '120bx+72ax+30ay+50by', ans: '2(5b+3a)(12x+5y)', tip: 'Erst die 2 aus allen. Dann Paare: 60bx + 25by und 36ax + 15ay.' },
    { n: '45', raw: '5mr+2np-5nr+n-2mp-m', ans: '(5r-2p-1)(m-n)', tip: 'Sortier nach m und n: 5mr − 2mp − m und −5nr + 2np + n.' },
    { n: '46', raw: 'xz-x-yz+y-z+1', ans: '(z-1)(x-y-1)', tip: 'Drei Paare, jedes hat (z − 1) drin.' },
    { n: '47', raw: '20ax+16bx-4cx-30ay-24by+6cy', ans: '2(5a+4b-c)(2x-3y)', blatt: M('(5a + 4b − c)(4x − 6y)'), note: 'Aus 4x − 6y kann noch die 2 raus. Darum will die App die 2 auch vorn sehen.', tip: 'Zwei Dreiergruppen: die ersten drei haben 4x, die letzten drei haben −6y.' },
    { n: '48', raw: '(64/9)a+(40/7)bc+(80/9)ac+(32/7)b', ans: '8(4+5c)((2/9)a+(1/7)b)',

  ] },

{ id: 'bruchplus', sheet: 'terme', title: 'Bruchterme plus und minus', range: 'Aufgabe a bis f', level: 'voll', form: 'frac', prompt: 'Fasse zusammen, Hauptnenner bilden.',
  lesson: [
    { k: 'bild', h: 'Zähler und Nenner', b: `<p>Ein Brett in 4 gleiche Stücke gesägt, du nimmst 3 davon. Das ist ${F(3, 4)}.</p><p>Der <b>Nenner</b> unten sagt, in wie viele Stücke geteilt wird, also wie groß ein Stück ist. Der <b>Zähler</b> oben zählt, wie viele Stücke du hast.</p>` },
    { k: 'merk', b: 'Der Nenner nennt die Stückgröße, der Zähler zählt die Stücke.' },
    { k: 'bild', h: 'Erst gleiche Einheit', b: '<p>Millimeter und Zoll kannst du nicht einfach zusammenzählen, erst auf eine Einheit bringen. Genauso bei Brüchen: Ein Drittel und ein Viertel sind verschieden große Stücke. Zusammenzählen geht erst, wenn alle Stücke gleich groß sind, also alle denselben Nenner haben.</p>' },

  return [s * h1, k1];
}

function padd(a, b, s = 1) { const out = new Map(a); b.forEach((c, k) => { const v = rq((out.get(k) || 0) + s * c); if (Math.abs(v) < 1e-9) out.delete(k); else out.set(k, v); }); return out; }
function pmul(a, b) { let out = new Map(); a.forEach((c1, k1) => b.forEach((c2, k2) => { const e = keyEx(k1), e2 = keyEx(k2); for (const k in e2) e[k] = (e[k] || 0) + e2[k]; out = padd(out, mono(rq(c1 * c2), e)); })); return out; }

  mengen(hard) {
    const kind = pick(hard ? ['ops', 'ops', 'iv', 'beschr', 'intervall'] : ['ops', 'iv', 'intervall']);

        const A = mk(), B = mk(), C = mk();

          ['A ∩ (B ∪ C)', x => has(A, x) && (has(B, x) || has(C, x))],

        const iv = () => { const a = r(-8, 4), b = a + r(3, 9); return { a, b, lo: Math.random() < 0.5, hi: Math.random() < 0.5 }; };
        const I = iv(), J = iv(), inI = (X, x) => (X.lo ? x >= X.a : x > X.a) && (X.hi ? x <= X.b : x < X.b);
        const opn = pick(['∩', '∪', '\\']);
        const xs = []; for (let x = -12; x <= 16; x++) { const p = inI(I, x), q = inI(J, x); if (opn === '∩' ? p && q : opn === '∪' ? p || q : p && !q) xs.push(x); }
        if (!xs.length || xs.length > 12) continue;

        () => { const a = r(2, 6), b = r(5, 14); const ans = []; for (let x = -20; x <= 20; x++) if (-a < 2 * x && 2 * x <= b) ans.push(x); return [`{x | x ∈ ℤ ∧ −${a} < 2x ≤ ${b}}`, ans]; },
        () => { const m = pick([3, 4, 6]), g = pick([20, 25, 30]); const ans = []; for (let x = 1; x < g; x++) if (x % m === 0) ans.push(x); return [`{n | n ∈ ℕ ∧ n ist Vielfaches von ${m} ∧ n < ${g}}`, ans]; },
        () => { const k = pick([18, 20, 28, 30, 36]); const ans = []; for (let x = 1; x <= k; x++) if (k % x === 0 && x % 2 === 0) ans.push(x); return [`{n | n ∈ ℕ ∧ n teilt ${k} ∧ n ist gerade}`, ans]; },
      ];

    }
    const a = r(-9, 5), b = a + r(2, 9), k = pick(['ab', 'ab', 'a', 'b']);

    else if (k === 'a') { s = `{x | x ∈ ℝ ∧ x ${lo ? '≥' : '>'} ${numD(a)}}`; ans = `${lo ? '[' : ']'}${a};∞[`; }
    else { s = `{x | x ∈ ℝ ∧ x ${hi ? '≤' : '<'} ${numD(b)}}`; ans = `]-∞;${b}${hi ? ']' : '['}`; }
    return { type: 'iv', prompt: 'Schreib als Intervall.', show: M(s), ans, tip: 'Kleiner gleich heißt: Zahl gehört dazu, Klammer umarmt sie. Unendlich bekommt immer die abgewandte Klammer.' };

  addsub(hard) {

    function item(depth) {

      const t = { prompt: 'Löse alle Klammern auf und fasse zusammen.', raw: g.s, ans: ptoStr(g.p), form: 'simp', tip: 'Von innen nach außen. Minus vor der Klammer dreht alles um. Steht vor einer Zahl ein ganzer Stapel Minus, zähl sie: gerade Anzahl gibt plus.' };
      if (Math.random() < (hard ? 0.6 : 0.5)) {

  summen(hard) {

    function polyN(n) { const arr = [], used = new Set(); let g = 0; while (arr.length < n && g++ < 50) { const t = mt(); if (used.has(t.v)) continue; used.add(t.v); arr.push(t); } return arr; }
    const sOf = arr => arr.map((t, i) => (t.c < 0 ? '-' : (i ? '+' : '')) + monoS(t.c, t.v)).join('');

        else { const A = polyN(2), B = polyN(2), C = polyN(2); s = `(${sOf(A)})(${sOf(B)})(${sOf(C)})`; q = pmul(pmul(pOf(A), pOf(B)), pOf(C)); }

  binom(hard) {

      const sg = [1, pick([1, -1]), pick([1, -1])];
      const s = ts3.map((t, i) => (sg[i] < 0 ? '-' : (i ? '+' : '')) + monoS(t.c, t.v)).join('');
      const B = ts3.reduce((p, t, i) => padd(p, lin(t.c, t.v), sg[i]), new Map());

        else { s = `(${ts(u)}${f === 'plus' ? '+' : '-'}${ts(w)})^2`; const B = padd(U, Wp, f === 'plus' ? 1 : -1); q = pmul(B, B); }
        const neg = j > 0 && Math.random() < 0.55;

  faktor(hard) {

    const shuffleTerms = P => { const ks = shuffle([...P.keys()]); return ks.map((k, i) => { const one = new Map([[k, P.get(k)]]); const s = ptoStr(one); return i && !s.startsWith('-') ? '+' + s : s; }).join(''); };

        const n = r(3, 4); let inner = new Map();

        return { prompt: 'Klammere so viel wie möglich aus.', raw: hard ? shuffleTerms(P) : ptoStr(P), ans: `${front}(${ptoStr(inner)})`, form: 'fac', tip };
      }
      if (kind === 'group') {
        const A = ['a', 'b'], X = ['x', 'y'];
        const two = (vars, allowConst) => { const v1 = vars[0], v2 = allowConst && Math.random() < 0.4 ? '' : vars[1]; return padd(lin(r(1, 5), v1), lin(rsg(1, 5), v2)); };

/* ===== Übungs-Sitzung ===== */
function mk(id) { const t = GEN[id](); t.topic = id; return t; }
function startSession(mode, ids, n) {
  let q = [];
  if (mode === 'mix') {
    const pool = [];
    ids.forEach(id => { const w = isDue(id) ? 3 : tp(id).box <= 2 ? 2 : 1; for (let i = 0; i < w; i++) pool.push(id); });
    let prev = null;
    for (let i = 0; i < n; i++) { let id, g = 0; do { id = pick(pool); g++; } while (id === prev && g < 20); q.push(mk(id)); prev = id; }
  } else q = Array.from({ length: n }, () => mk(ids[0]));
  S = { mode, q, i: 0, res: [], base: n, ids };
  const sh = $('#sheet'); sh.classList.add('open', 'anim'); sh.scrollTop = 0; setTimeout(() => sh.classList.remove('anim'), 350);

}
function newCard() {
  const t = S.q[S.i];

  if (S.mode === 'mix') {

}
function closeSheet() { S = null; $('#sheet').innerHTML = ''; $('#sheet').className = ''; document.body.style.overflow = ''; render(); }

  }

  if (t.type === 'mc') {
    h += `<div class="expr" style="font-size:20px;white-space:normal">${t.prompt}</div>`;
    h += t.opts.map((o, i) => { let cls = ''; if (c.fb) { if (i === t.correct) cls = 'ok'; else if (i === c.picked) cls = 'no'; } return `<button class="opt ${cls}" data-mc="${i}" ${c.fb ? 'disabled' : ''}>${o}</button>`; }).join('');
  } else {

      if (t.type !== 'num') h += `<div class="keys">${['(', ')', '²', '^', '·', '/', 'x', 'y', 'a', 'b', 'c', '−'].map(k => `<button class="key" data-key="${k}" tabindex="-1">${k}</button>`).join('')}</div>`;

    if (c.shown < t.steps.length) h += `<div class="btnrow"><button class="btn sec2" data-next>Nächster Schritt</button><button class="btn plain" data-all>Alle zeigen</button></div>`;
    h += `</div>`;
  }
  if (t.type === 'mc') h += c.fb ? `<div style="margin-top:16px"><button class="btn" data-weiter>Weiter</button></div>` : '';
  else if (solved || c.reveal) h += `<div style="margin-top:16px"><button class="btn" data-weiter>Weiter</button></div>`;
  else if (wrong) h += `<div class="btnrow"><button class="btn sec2" data-check>Nochmal prüfen</button><button class="btn plain" data-reveal>Lösungsweg</button></div>`;
  else h += `<div style="margin-top:16px"><button class="btn" data-check>Prüfen</button></div>`;
  sh.innerHTML = h + '</div>';
  const inp = $('#inp');
  if (inp) { updPreview(); if (!wrong) setTimeout(() => { try { inp.focus({ preventScroll: true }); } catch (e) {} }, 60); }
}
function updPreview() {
  const inp = $('#inp'), pv = $('#pv'); if (!inp) return;
  if (inp.tagName === 'TEXTAREA') { inp.style.height = 'auto'; inp.style.height = inp.scrollHeight + 2 + 'px'; }
  if (S && S.c) S.c.input = inp.value;
  if (W) W.input = inp.value;
  if (typeof PR !== 'undefined' && PR) PR.input = inp.value;
  if (typeof X !== 'undefined' && X) X.input = inp.value;
  if (!pv) return;
  const v = inp.value.trim();
  if (!v) { pv.innerHTML = ''; return; }
  try { pv.innerHTML = 'Gelesen als ' + toH(parse(v)); } catch (e) { pv.innerHTML = ''; }
}
function doCheck() {
  const t = S.q[S.i], c = S.c, v = ($('#inp') || {}).value || '';
  if (!v.trim()) return;
  c.input = v;
  const res = checkAnswer(t, v);
  c.fb = res;
  if (res.status === 'ok') { if (c.first === null) c.first = true; c.shown = 0; }
  if (res.status === 'wrong' && c.first === null) c.first = false;
  renderSheet();
}
function weiter() {
  const t = S.q[S.i], c = S.c;
  S.res.push({ topic: t.topic, ok: c.first === true });
  if (c.first !== true && S.q.length < S.base + 4) S.q.splice(Math.min(S.i + 3, S.q.length), 0, mk(t.topic));
  S.i++;
  if (S.i >= S.q.length) { finish(); return; }
  newCard(); renderSheet();
  $('#sheet').scrollTop = 0;
}
function finish() {
  const by = {};
  S.res.forEach(r => { (by[r.topic] = by[r.topic] || { r: 0, n: 0 }); by[r.topic].n++; if (r.ok) by[r.topic].r++; });
  S.sum = [];
  const now = Date.now();
  for (const id in by) {
    const s = Object.assign({}, tp(id)), b = by[id], acc = b.r / b.n, old = s.box;
    if (b.n >= 2 || S.mode === 'learn') {
      if (acc >= 0.8) s.box = Math.min(5, s.box + 1);
      else if (acc < 0.5) s.box = 1;
      else s.box = Math.max(1, s.box);
      s.due = now + INT[s.box] * DAY;
    }
    s.right += b.r; s.total += b.n; s.last = now;
    state.topics[id] = s;
    S.sum.push({ id, r: b.r, n: b.n, old, box: s.box });
  }
  save();
  S.done = true; renderSheet();
}
function summaryHTML() {
  const tot = S.res.length, ok = S.res.filter(r => r.ok).length;
  const msg = ok / tot >= 0.8 ? 'Sitzt gut.' : ok / tot >= 0.5 ? 'Auf dem Weg. Die Fehler kommen gleich wieder dran, so festigt es sich.' : 'Noch wackelig, völlig normal am Anfang. Sieh dir das Beispiel nochmal an und üb morgen weiter.';
  return `<div class="wrap" style="padding-top:28px"><div class="hero"><div class="muted">Beim ersten Versuch richtig</div><div class="score">${ok} von ${tot}</div><p style="margin:6px 0 0">${msg}</p></div>
  <div class="sec">Festigkeit</div><div class="group">${S.sum.map(x => `<div class="row"><span class="num">${T[x.id].n}</span><span class="grow"><div class="t">${T[x.id].title}</div><div class="s">${x.r} von ${x.n} richtig. ${LEVELS[x.box]}. ${dueText(x.id)}</div></span>${lvl(x.box)}</div>`).join('')}</div>

/* ===== Events ===== */
document.addEventListener('click', e => {
  const b = e.target.closest('button, a'); if (!b) return;
  const d = b.dataset;
  if (d.go) { exShown = {}; go(d.go); return; }
  if (d.learn) { startSession('learn', [d.learn], 6); return; }
  if (d.review) { startSession('learn', [d.review], 5); return; }
  if ('startmix' in d) { startSession('mix', started().map(t => t.id), 10); return; }
  if (d.step) { exShown[d.step] = (exShown[d.step] || 0) + 1; render(); return; }
  if (d.stepreset) { exShown[d.stepreset] = 0; render(); return; }
  if ('reset' in d) { if (resetArmed) { state.topics = {}; state.sheet = {}; state.mix = {}; save(); resetArmed = false; go('blatt'); } else { resetArmed = true; render(); setTimeout(() => { resetArmed = false; if (view === 'method' && !S) render(); }, 4000); } return; }
  if (wClick(d)) return;
  if (xClick(d)) return;
  if (bClick(d)) return;
  if (prClick(d)) return;
  if (handClick(d)) return;
  if (!S) return;
  if ('close' in d) { closeSheet(); return; }
  if (d.recog) { S.c.chosen = d.recog; S.c.recog = d.recog === S.q[S.i].topic; S.c.phase = 'answer'; renderSheet(); return; }
  if (d.mc !== undefined) {
    const t = S.q[S.i], i = +d.mc; S.c.picked = i;

  if ('retry' in d) { S.c.fb = null; renderSheet(); return; }
  if ('reveal' in d) { S.c.reveal = true; S.c.shown = 1; renderSheet(); return; }
  if ('next' in d) { S.c.shown++; renderSheet(); return; }
  if ('all' in d) { S.c.shown = S.q[S.i].steps.length; renderSheet(); return; }
  if ('weiter' in d) { weiter(); return; }
});
document.addEventListener('pointerdown', e => {

document.addEventListener('input', e => { if (e.target.id === 'inp') { if (S && S.c.fb && S.c.fb.status !== 'wrong') { S.c.fb = null; const f = document.querySelector('.fb'); if (f) f.remove(); } updPreview(); } });

  if (e.key !== 'Enter' || e.target.id !== 'inp') return;

<script>

  h += `<div class="padwrap"><canvas id="pad" style="height:${P.h}px" aria-label="Rechenkästchen zum Schreiben"></canvas></div>`;
  h += `<div class="padtools"><button class="mini" data-pundo ${P.strokes.length ? '' : 'disabled'}>Rückgängig</button><button class="mini" data-pclear ${P.strokes.length ? '' : 'disabled'}>Leeren</button><button class="mini" data-pmore>Mehr Platz</button></div>`;
  if (P.phase === 'reading') h += `<div class="fb mid">Ich lese deine Schrift<small>Das dauert meist 10 bis 30 Sekunden.</small></div><div class="btnrow"><button class="btn plain" data-pstop>Abbrechen</button></div>`;
  else h += `<div style="margin-top:12px"><button class="btn" data-pread id="pread" ${P.strokes.length && HAND ? '' : 'disabled'}>${HAND === null ? 'Erkennung lädt' : 'Prüfen'}</button></div>`;
  if (P.err) h += `<div class="fb no">Hat nicht geklappt<small>${P.err}</small></div>`;
  if (P.note) h += `<div class="fb mid">Hinweis<small>${P.note}</small></div>`;
  if (!P.strokes.length && P.phase === 'draw') h += `<p class="note" style="margin-left:0">Jeden Schritt in eine eigene Zeile schreiben und das Ergebnis doppelt unterstreichen. Beim Prüfen liest Claude deine Schrift, das zählt zu deinem Claude-Kontingent.</p>`;
  return h;
}

function inkColor() { return getComputedStyle(document.body).color || '#000'; }
function drawStroke(ctx, s) {
  if (!s.length) return;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (s.length === 1) { ctx.beginPath(); ctx.arc(s[0].x, s[0].y, s[0].w / 2, 0, Math.PI * 2); ctx.fill(); return; }
  for (let i = 1; i < s.length; i++) { ctx.lineWidth = s[i].w; ctx.beginPath(); ctx.moveTo(s[i - 1].x, s[i - 1].y); ctx.lineTo(s[i].x, s[i].y); ctx.stroke(); }
}
function padMount(key, rerender) {
  const c = $('#pad'); if (!c) return;
  const P = hs(key), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth;
  c.width = Math.round(w * dpr); c.height = Math.round(P.h * dpr);
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  const ink = inkColor(); ctx.strokeStyle = ink; ctx.fillStyle = ink;
  P.strokes.forEach(s => drawStroke(ctx, s));
  let cur = null;
  const pos = e => { const r = c.getBoundingClientRect(); const pr = e.pressure && e.pointerType === 'pen' ? e.pressure : 0.5; return { x: e.clientX - r.left, y: e.clientY - r.top, w: 1.4 + pr * 2.4 }; };
  const toolsOn = () => { ['[data-pundo]', '[data-pclear]'].forEach(sel => { const b = document.querySelector(sel); if (b) b.disabled = !P.strokes.length; }); const b = $('#pread'); if (b) b.disabled = !(P.strokes.length && HAND); };
  c.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch' && P.pen) return;
    if (e.pointerType === 'pen') P.pen = true;
    e.preventDefault();
    try { c.setPointerCapture(e.pointerId); } catch (x) {}
    const p = pos(e); cur = { id: e.pointerId, s: [p] }; P.strokes.push(cur.s);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.w / 2, 0, Math.PI * 2); ctx.fill();
    if (P.note || P.err) { P.note = null; P.err = null; }
  });
  c.addEventListener('pointermove', e => {
    if (!cur || e.pointerId !== cur.id) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) {
      const p = pos(ev), last = cur.s[cur.s.length - 1];
      if (Math.abs(p.x - last.x) + Math.abs(p.y - last.y) < 0.8) continue;
      ctx.lineCap = 'round'; ctx.lineWidth = p.w; ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      cur.s.push(p);
    }
  });
  const end = e => { if (cur && e.pointerId === cur.id) { cur = null; toolsOn(); } };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
}
function padBlob(P) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  P.strokes.forEach(s => s.forEach(p => { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }));
  const m = 24, W0 = x1 - x0 + 2 * m, H0 = y1 - y0 + 2 * m;
  const sc = Math.max(1, Math.min(3, 1500 / Math.max(W0, H0)));
  const cv = document.createElement('canvas'); cv.width = Math.round(W0 * sc); cv.height = Math.round(H0 * sc);
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(sc, 0, 0, sc, (m - x0) * sc, (m - y0) * sc);
  ctx.strokeStyle = '#000'; ctx.fillStyle = '#000';
  P.strokes.forEach(s => drawStroke(ctx, s.map(p => ({ x: p.x, y: p.y, w: Math.max(2.2, p.w) }))));
  return new Promise(res => cv.toBlob(res, 'image/png'));
}
function handPrompt(t) {
  const task = t.raw ? t.raw : String(t.show || '').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
  return `Auf dem Bild ist die handschriftliche Mathe-Rechnung eines Schülers, schwarze Schrift auf weißem Grund. Zur Orientierung, die Aufgabe lautete: ${task}
Schreib genau ab, was er geschrieben hat, Zeile für Zeile von oben nach unten. Verbessere nichts und ergänze nichts, auch wenn es falsch oder unvollständig ist. Ist ein Zeichen unleserlich, schreib dort ein ?.
Der Ausdruck, der doppelt unterstrichen ist, ist sein Endergebnis. Markiere genau diese Zeile mit "final": true, alle anderen mit false. Gibt es keine doppelte Unterstreichung, setze überall false.
Schreibweise für "text": Mal als * oder Faktoren direkt nebeneinander (3x, 2(a+b)), Brüche als (Zähler)/(Nenner) mit Klammern, Hochzahlen mit ^ (x^2), Kommazahlen mit Komma, Minus als -. Mengen mit { } und ; und Intervalle mit [ ] genau wie geschrieben, unendlich als ∞. Ein Gleichheitszeichen am Zeilenanfang weglassen. Steht in einer Zeile eine Kette wie A = B = C, gib jeden Teil als eigene Zeile aus. Die Unterstreichungsstriche selbst nicht abschreiben.
Antworte nur mit JSON in dieser Form: {"lines":[{"text":"3x+4-x","final":false},{"text":"2x+4","final":true}]}`;
}
function handErr(e) {
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled' || c === 'capability_removed' || c === 'images_unavailable') { HAND = false; HAND_WHY = 'Grund E: ' + c + '.'; return 'Die Schrifterkennung ist nicht erlaubt oder hier nicht verfügbar. Im Handy-Modus kannst du weiter tippen.'; }
  if (c === 'rate_limited') return 'Gerade zu viele Anfragen oder dein Kontingent ist erreicht. Versuch es später nochmal.';
  if (c === 'invalid_json' || c === 'empty_completion') return 'Ich konnte deine Schrift nicht sauber lesen. Schreib etwas größer und tipp nochmal auf Prüfen.';
  if (c === 'session_expired') return 'Du musst dich in Claude neu anmelden.';
  if (c === 'cancelled') return null;
  return 'Verbindung hat nicht geklappt. Tipp nochmal auf Prüfen. (Code: ' + (c || 'unbekannt') + ')';
}
async function handRead(key, t, rr) {
  const P = hs(key); if (!P.strokes.length || !SAMPLE) return;
  P.phase = 'reading'; P.err = null; P.note = null; rr();
  try {
    const blob = await padBlob(P);
    P.ctl = new AbortController();
    const res = await SAMPLE.json(handPrompt(t), { images: blob, signal: P.ctl.signal, modelTier: 'default' });
    const lines = (res && Array.isArray(res.lines) ? res.lines : []).map(l => ({ text: String(l && l.text || '').replace(/^\s*=\s*/, '').trim(), final: !!(l && l.final) })).filter(l => l.text);
    if (!lines.length) { P.phase = 'draw'; P.err = 'Ich konnte keine Rechnung erkennen. Schreib etwas größer und deutlicher.'; }
    else { P.read = lines; P.phase = 'confirm'; }
  } catch (e) { P.phase = 'draw'; P.err = handErr(e); }
  rr();
}
function handCollect(key) { const P = hs(key); return P.read.map((L, i) => { const el = document.getElementById('hl' + i); return { text: (el ? el.value : L.text).trim(), final: L.final }; }).filter(L => L.text); }

/* Alle gelesenen Zeilen prüfen: wie beim Tippen, nur auf einmal */
function evalHand(t, read) {
  const setlike = t.type === 'set' || t.type === 'iv';
  const out = []; let done = false, vdone = false, prevOk = false;
  read.forEach(L => {
    const s = L.text;
    if (setlike && !/[\d∞]/.test(s)) return;
    if (t.val && done && !/[a-z]/i.test(s)) { const r = checkVal(t, s); out.push({ s, st: r.ok ? 'ok' : 'no', msg: r.ok ? '' : r.msg, fin: L.final, v: true }); if (r.ok) vdone = true; return; }
    const r = checkBlatt(t, s, prevOk);
    if (r.st === 'err') { out.push({ s, st: 'mid', msg: 'Diese Zeile konnte ich nicht als Rechnung lesen.', fin: L.final }); return; }
    out.push({ s, st: r.st, msg: r.msg || '', fin: L.final });
    prevOk = r.st !== 'no';
    if (r.st === 'done') done = true;
  });
  if (!out.length) return { lines: [], done: false, vdone: false, note: 'Ich habe keine Rechnung gefunden.' };
  let fin = out.filter(L => L.fin).pop(), note = null;
  if (!fin) { fin = out[out.length - 1]; note = 'Ich habe kein doppelt unterstrichenes Ergebnis gefunden und die letzte Zeile als Ergebnis genommen.'; }
  let termDone, valDone = false;
  if (t.val) {
    const termLines = out.filter(L => !L.v);
    termDone = termLines.some(L => L.st === 'done');
    valDone = fin.v ? fin.st === 'ok' : false;
    if (termDone && !valDone && !note) note = 'Der Term stimmt. Jetzt noch einsetzen und den Wert doppelt unterstreichen.';
    if (!termDone && !note) note = fin.st === 'no' ? 'Dein Ergebnis stimmt noch nicht. Schau auf die erste rote Zeile.' : 'Dein Term ist noch nicht fertig zusammengefasst.';
  } else {
    termDone = fin.st === 'done';
    if (!termDone && !note) note = fin.st === 'no' ? 'Dein doppelt unterstrichenes Ergebnis stimmt nicht. Schau auf die erste rote Zeile, da steckt der Fehler.' : 'Dein Ergebnis stimmt, ist aber noch nicht fertig.';
    if (!termDone && note && fin.st !== 'no' && fin.msg) note += ' ' + fin.msg.replace(/^Stimmt\.\s*/, '');
  }
  return { lines: out.map(L => ({ s: L.s, st: L.st, msg: (L.st === 'ok' && L !== fin) ? '' : L.msg })), done: termDone, vdone: valDone, note };
}

function handClick(d) {
  if (d.mode) { state.inputMode = d.mode; saveLocal(); if (W) renderW(); else if (X) renderX(); return true; }
  const ctx = W ? 'W' : X ? 'X' : null; if (!ctx) return false;
  let key, t, rr;
  if (ctx === 'W') { const s = SEC[W.sec]; t = s.tasks[W.i]; key = tKey(s, t); rr = renderW; }
  else { t = X.task; key = 'mix:' + X.id; rr = renderX; }
  const P = hs(key);
  if ('pundo' in d) { P.strokes.pop(); rr(); return true; }
  if ('pclear' in d) { P.strokes = []; P.note = null; P.err = null; rr(); return true; }
  if ('pmore' in d) { P.h += 260; rr(); const c = $('#pad'); if (c) c.scrollIntoView({ block: 'end', behavior: 'smooth' }); return true; }
  if ('pread' in d) { handRead(key, t, rr); return true; }
  if ('pstop' in d) { if (P.ctl) P.ctl.abort(); P.phase = 'draw'; rr(); return true; }
  if ('hback' in d) { P.phase = 'draw'; rr(); return true; }
  if (d.hfin !== undefined) { P.read = handCollect(key).map((L, i) => ({ text: L.text, final: i === +d.hfin ? !P.read[i].final : false })); rr(); return true; }
  if ('hok' in d) {
    const read = handCollect(key); P.read = read;
    const r = evalHand(t, read);
    P.phase = 'draw'; P.note = (r.done && (!t.val || r.vdone)) ? null : r.note;
    if (ctx === 'W') {
      const st = { lines: r.lines.slice(-14), done: r.done, vdone: r.vdone, vline: '' };
      setW(key, st);
    } else {
      X.lines = r.lines; X.done = r.done; X.vdone = r.vdone;
      if (r.lines.some(L => L.st === 'no')) X.err = true;
      if (r.done && (!t.val || r.vdone)) xCount(!X.err && !X.reveal);
    }
    rr();
    const ln = $('#sheet').querySelector('.lines'); if (ln) ln.scrollIntoView({ block: 'start', behavior: 'smooth' });
    return true;
  }
  return false;
}
