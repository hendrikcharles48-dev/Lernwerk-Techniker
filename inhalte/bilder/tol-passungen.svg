<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Toleranzfelder zur Nulllinie: Die Bohrung H beginnt genau auf der Nulllinie. Liegt die Welle ganz darunter, gibt es immer Spiel. Überlappen sich die Felder, ist es eine Übergangspassung. Liegt die Welle ganz über der Bohrung, gibt es immer Übermaß."><line class="l" x1="20.0" y1="125.0" x2="340.0" y2="125.0"/><text class="t2" x="338" y="141" text-anchor="end">Nulllinie</text><rect class="fb" x="40" y="75" width="50" height="50" rx="0"/><rect class="b" x="40" y="75" width="50" height="50" rx="0"/><text class="bt" x="65" y="67" text-anchor="middle">Bohrung H</text><rect class="fg" x="130" y="145" width="40" height="40" rx="0"/><rect class="g" x="130" y="145" width="40" height="40" rx="0"/><text class="gt" x="150" y="201" text-anchor="middle">Welle: Spiel</text><rect class="fo" x="210" y="100" width="40" height="45" rx="0"/><rect class="o" x="210" y="100" width="40" height="45" rx="0"/><text class="ot" x="230" y="161" text-anchor="middle">Welle: Übergang</text><rect class="fr" x="290" y="30" width="40" height="40" rx="0"/><rect class="r" x="290" y="30" width="40" height="40" rx="0"/><text class="rt" x="310" y="22" text-anchor="middle">Welle: Übermaß</text><line class="d" x1="40.0" y1="75.0" x2="340.0" y2="75.0"/></svg>