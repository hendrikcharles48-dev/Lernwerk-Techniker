<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-label="Regelkreis: Der Regler vergleicht den Sollwert w mit dem Istwert x. Aus der Regeldifferenz e = w − x macht er die Stellgröße y. Die Strecke reagiert, x wird wieder gemessen, und der Kreis schließt sich."><circle class="l bgf" cx="60" cy="70" r="14"/><text class="t" x="52" y="66" text-anchor="middle">+</text><text class="t" x="66" y="82" text-anchor="middle">−</text><line class="l" x1="4.0" y1="70.0" x2="36.8" y2="70.0"/><polygon class="lf" points="44.0,70.0 35.7,73.5 35.7,66.5"/><text class="t" x="12" y="60" text-anchor="middle">w</text><line class="l" x1="74.0" y1="70.0" x2="112.8" y2="70.0"/><polygon class="lf" points="120.0,70.0 111.7,73.5 111.7,66.5"/><text class="t" x="97" y="60" text-anchor="middle">e</text><rect class="l fb" x="120" y="50" width="70" height="40" rx="0"/><text class="t" x="155" y="75" text-anchor="middle">Regler</text><line class="l" x1="190.0" y1="70.0" x2="228.8" y2="70.0"/><polygon class="lf" points="236.0,70.0 227.7,73.5 227.7,66.5"/><text class="t" x="213" y="60" text-anchor="middle">y</text><rect class="l fo" x="236" y="50" width="70" height="40" rx="0"/><text class="t" x="271" y="75" text-anchor="middle">Strecke</text><line class="l" x1="306.0" y1="70.0" x2="344.8" y2="70.0"/><polygon class="lf" points="352.0,70.0 343.7,73.5 343.7,66.5"/><text class="t" x="340" y="60" text-anchor="middle">x</text><line class="l" x1="330.0" y1="70.0" x2="330.0" y2="140.0"/><line class="l" x1="330.0" y1="140.0" x2="60.0" y2="140.0"/><line class="l" x1="60.0" y1="140.0" x2="60.0" y2="93.2"/><polygon class="lf" points="60.0,86.0 63.5,94.3 56.5,94.3"/><text class="t2" x="195" y="132" text-anchor="middle">Rückführung: Istwert x wird gemessen</text><text class="bt" x="180" y="180" text-anchor="middle">e = w − x: Sollwert minus Istwert</text></svg>