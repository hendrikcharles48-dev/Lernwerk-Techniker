<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-label="Toleranzrahmen von links nach rechts lesen: Erst das Symbol für die Eigenschaft, hier Rechtwinkligkeit. Dann der Toleranzwert in mm. Dann der Bezug, hier die Fläche A."><rect class="l bgf" x="60" y="40" width="240" height="40" rx="0"/><line class="l" x1="120.0" y1="40.0" x2="120.0" y2="80.0"/><line class="l" x1="230.0" y1="40.0" x2="230.0" y2="80.0"/><line class="l" x1="90.0" y1="50.0" x2="90.0" y2="72.0"/><line class="l" x1="76.0" y1="72.0" x2="104.0" y2="72.0"/><text class="t" x="175" y="67" text-anchor="middle" style="font-size:18px;">0,05</text><text class="t" x="265" y="67" text-anchor="middle" style="font-size:18px;">A</text><text class="bt" x="90" y="110" text-anchor="middle">Symbol</text><text class="ot" x="175" y="110" text-anchor="middle">Toleranz</text><text class="gt" x="265" y="110" text-anchor="middle">Bezug</text><line class="b" x1="90.0" y1="84.0" x2="90.0" y2="96.0"/><line class="o" x1="175.0" y1="84.0" x2="175.0" y2="96.0"/><line class="g" x1="265.0" y1="84.0" x2="265.0" y2="96.0"/><text class="t" x="180" y="150" text-anchor="middle">Rechtwinklig zu A, höchstens 0,05 mm daneben</text></svg>