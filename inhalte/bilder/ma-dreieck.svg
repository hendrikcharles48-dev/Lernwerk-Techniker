<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img" aria-label="Rechtwinkliges Dreieck vom Winkel α aus gesehen: Die Hypotenuse liegt gegenüber dem rechten Winkel. Die Gegenkathete liegt gegenüber von α, die Ankathete liegt an α. sin α = G / H, cos α = A / H, tan α = G / A."><polygon class="fl" points="50.0,180.0 300.0,180.0 300.0,50.0"/><polygon class="l" points="50.0,180.0 300.0,180.0 300.0,50.0"/><rect class="l" x="284" y="164" width="16" height="16" rx="0"/><path class="l" d="M 100 180 A 50 50 0 0 0 94.4 157"/><text class="t" x="112" y="172" text-anchor="middle">α</text><text class="bt" x="175" y="200" text-anchor="middle">Ankathete</text><text class="ot" x="292" y="124" text-anchor="end">Gegenkathete</text><text class="gt" x="160" y="104" text-anchor="end">Hypotenuse</text><text class="t" x="90" y="40" text-anchor="start">sin α = G / H</text><text class="t" x="90" y="58" text-anchor="start">cos α = A / H</text><text class="t" x="90" y="76" text-anchor="start">tan α = G / A</text></svg>