<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 235" role="img" aria-label="Das 4 bis 20 mA Signal: 4 mA heißt Anfang des Messbereichs, 20 mA heißt Ende. Dazwischen ist es eine Gerade. Messwert = (I − 4) / 16 · Spanne + Anfangswert. Unter 4 mA ist etwas kaputt."><line class="l" x1="60.0" y1="190.0" x2="333.6" y2="190.0"/><polygon class="lf" points="340.0,190.0 332.6,193.1 332.6,186.9"/><line class="l" x1="60.0" y1="190.0" x2="60.0" y2="40.4"/><polygon class="lf" points="60.0,34.0 63.1,41.4 56.9,41.4"/><text class="t2" x="66" y="38" text-anchor="start">I in mA</text><line class="b" x1="60.0" y1="162.0" x2="300.0" y2="50.0"/><line class="l" x1="56.0" y1="162.0" x2="60.0" y2="162.0"/><text class="t2" x="52" y="166" text-anchor="end">4</text><line class="d" x1="60.0" y1="162.0" x2="340.0" y2="162.0"/><line class="l" x1="56.0" y1="106.0" x2="60.0" y2="106.0"/><text class="t2" x="52" y="110" text-anchor="end">12</text><line class="d" x1="60.0" y1="106.0" x2="340.0" y2="106.0"/><line class="l" x1="56.0" y1="50.0" x2="60.0" y2="50.0"/><text class="t2" x="52" y="54" text-anchor="end">20</text><line class="d" x1="60.0" y1="50.0" x2="340.0" y2="50.0"/><text class="t2" x="60" y="206" text-anchor="middle">Anfang</text><text class="t2" x="300" y="206" text-anchor="middle">Ende</text><text class="t2" x="180" y="206" text-anchor="middle">Messbereich</text><line class="d" x1="300.0" y1="50.0" x2="300.0" y2="190.0"/><text class="bt" x="180" y="18" text-anchor="middle">Messwert = (I − 4) / 16 · Spanne</text><text class="rt" x="200" y="228" text-anchor="middle">unter 4 mA heißt Leitungsbruch</text></svg>