<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 225" role="img" aria-label="Riementrieb: Die kleine Scheibe treibt. Der Riemen ist auf der ziehenden Seite stärker gespannt, das ist das Lasttrum mit F₁. Die andere Seite ist das Leertrum mit F₂. Die Umfangskraft ist F_u = F₁ − F₂."><circle class="fl" cx="90" cy="100" r="40"/><circle class="l" cx="90" cy="100" r="40"/><circle class="fl" cx="270" cy="100" r="65"/><circle class="l" cx="270" cy="100" r="65"/><circle class="lf" cx="90" cy="100" r="3.2"/><circle class="lf" cx="270" cy="100" r="3.2"/><line class="r" x1="90.0" y1="60.0" x2="270.0" y2="35.0"/><line class="b" x1="90.0" y1="140.0" x2="270.0" y2="165.0"/><text class="rt" x="180" y="30" text-anchor="middle">Lasttrum F₁, gespannt</text><text class="bt" x="180" y="186" text-anchor="middle">Leertrum F₂, lockerer</text><path class="l" d="M 60 54 A 55 55 0 0 0 70 152"/><polygon class="lf" points="70.0,152.0 61.1,150.9 64.5,144.8"/><text class="t2" x="90" y="124" text-anchor="middle">treibend</text><text class="t2" x="270" y="128" text-anchor="middle">getrieben</text><text class="t" x="180" y="214" text-anchor="middle">Umfangskraft F<tspan dy="4" style="font-size:0.75em">u</tspan><tspan dy="-4">​</tspan> = F₁ − F₂</text></svg>