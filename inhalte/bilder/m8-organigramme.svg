<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-label="Drei Formen der Aufbauorganisation: Im Einliniensystem hat jede Stelle genau einen Chef. Im Stabliniensystem hängt ein Stab seitlich an der Linie und berät nur. In der Matrix kreuzen sich Funktionen und Sparten, jede Stelle hat zwei Chefs."><rect class="l bgf" x="40.0" y="30.0" width="40" height="20" rx="0"/><line class="l" x1="60.0" y1="50.0" x2="60.0" y2="70.0"/><line class="l" x1="30.0" y1="70.0" x2="90.0" y2="70.0"/><line class="l" x1="30.0" y1="70.0" x2="30.0" y2="85.0"/><rect class="l bgf" x="13.0" y="85.0" width="34" height="20" rx="0"/><line class="l" x1="90.0" y1="70.0" x2="90.0" y2="85.0"/><rect class="l bgf" x="73.0" y="85.0" width="34" height="20" rx="0"/><text class="bt" x="60" y="140" text-anchor="middle">Einlinie</text><text class="t2" x="60" y="156" text-anchor="middle">ein Chef</text><rect class="l bgf" x="160.0" y="30.0" width="40" height="20" rx="0"/><line class="l" x1="180.0" y1="50.0" x2="180.0" y2="70.0"/><line class="l" x1="150.0" y1="70.0" x2="210.0" y2="70.0"/><line class="l" x1="150.0" y1="70.0" x2="150.0" y2="85.0"/><rect class="l bgf" x="133.0" y="85.0" width="34" height="20" rx="0"/><line class="l" x1="210.0" y1="70.0" x2="210.0" y2="85.0"/><rect class="l bgf" x="193.0" y="85.0" width="34" height="20" rx="0"/><line class="d" x1="200.0" y1="40.0" x2="222.0" y2="40.0"/><rect class="l fo" x="223.0" y="31.0" width="34" height="18" rx="0"/><text class="ot" x="240" y="26" text-anchor="middle">Stab</text><text class="bt" x="180" y="140" text-anchor="middle">Stablinie</text><text class="t2" x="180" y="156" text-anchor="middle">Stab berät nur</text><line class="b" x1="285.0" y1="50.0" x2="345.0" y2="50.0"/><line class="b" x1="285.0" y1="80.0" x2="345.0" y2="80.0"/><line class="b" x1="285.0" y1="110.0" x2="345.0" y2="110.0"/><line class="o" x1="300.0" y1="30.0" x2="300.0" y2="120.0"/><line class="o" x1="330.0" y1="30.0" x2="330.0" y2="120.0"/><circle class="l bgf"