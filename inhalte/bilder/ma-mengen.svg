<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-label="Zwei Mengen A und B: Die Mitte, wo sich beide Kreise überlappen, ist die Schnittmenge A ∩ B. Beide Kreise zusammen sind die Vereinigung A ∪ B. A ohne die Mitte ist A \ B."><rect class="d" x="20" y="15" width="320" height="165" rx="0"/><circle class="fb" cx="140" cy="98" r="70"/><circle class="fo" cx="220" cy="98" r="70"/><circle class="l" cx="140" cy="98" r="70"/><circle class="l" cx="220" cy="98" r="70"/><text class="t" x="105" y="102" text-anchor="middle" style="font-size:18px;">A</text><text class="t" x="255" y="102" text-anchor="middle" style="font-size:18px;">B</text><text class="t" x="180" y="104" text-anchor="middle">A ∩ B</text><text class="t2" x="36" y="34" text-anchor="start">G</text><text class="t2" x="180" y="196" text-anchor="middle">Schnitt ∩: in beiden. Vereinigung ∪: in mindestens einer.</text></svg>