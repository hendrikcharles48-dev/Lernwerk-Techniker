<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Eine Gerade y = m · x + b: b ist der Punkt, an dem sie die y-Achse schneidet. Die Steigung m sagt, wie viel y wächst, wenn x um 1 wächst. Am Steigungsdreieck: m = Δy / Δx."><line class="l" x1="60.0" y1="190.0" x2="333.6" y2="190.0"/><polygon class="lf" points="340.0,190.0 332.6,193.1 332.6,186.9"/><line class="l" x1="60.0" y1="190.0" x2="60.0" y2="21.4"/><polygon class="lf" points="60.0,15.0 63.1,22.4 56.9,22.4"/><text class="t2" x="340" y="206" text-anchor="end">x</text><text class="t2" x="66" y="19" text-anchor="start">y</text><line class="b" x1="60.0" y1="134.0" x2="312.0" y2="8.0"/><circle class="rf" cx="60" cy="134" r="4"/><text class="rt" x="68" y="152" text-anchor="start">b: Schnitt mit der y-Achse</text><line class="o" x1="144.0" y1="92.0" x2="256.0" y2="92.0"/><line class="g" x1="256.0" y1="92.0" x2="256.0" y2="36.0"/><text class="ot" x="200" y="110.0" text-anchor="middle">Δx</text><text class="gt" x="264" y="72.0" text-anchor="start">Δy</text><text class="bt" x="120" y="30" text-anchor="start">y = m · x + b</text><text class="t" x="120" y="48" text-anchor="start">m = Δy / Δx</text></svg>