<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" role="img" aria-label="Ein Draht mit Länge l und Querschnitt A: Je länger, desto größer der Widerstand. Je dicker, desto kleiner. R = ρ · l / A, mit ρ vom Werkstoff."><rect class="fo" x="70" y="70" width="230" height="40" rx="0"/><line class="l" x1="70.0" y1="70.0" x2="300.0" y2="70.0"/><line class="l" x1="70.0" y1="110.0" x2="300.0" y2="110.0"/><path class="l fo" d="M 70 70 A 12 20 0 0 0 70 110 A 12 20 0 0 0 70 70"/><path class="l" d="M 300 70 A 12 20 0 0 1 300 110"/><text class="ot" x="52" y="96" text-anchor="end" style="font-size:16px;">A</text><line class="d2" x1="70.0" y1="140.0" x2="295.2" y2="140.0"/><polygon class="d2f" points="300.0,140.0 294.5,142.3 294.5,137.7"/><polygon class="d2f" points="70.0,140.0 75.5,137.7 75.5,142.3"/><text class="t2" x="185.0" y="134.0" text-anchor="middle">Länge l</text><text class="bt" x="185" y="175" text-anchor="middle" style="font-size:16px;">R = ρ · l / A</text><text class="t2" x="185" y="50" text-anchor="middle">Werkstoff mit ρ, Kupfer 0,0178 Ω · mm² / m</text></svg>