<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Schema für den Nettopersonalbedarf von oben nach unten: Soll minus Ist, dann Neubedarf dazu und Minderbedarf weg. Zugänge schließen die Lücke, Abgänge vergrößern sie. Positiv heißt, es fehlen Leute."><rect class="l bgf" x="14" y="16" width="200" height="26" rx="0"/><text class="t" x="24" y="34" text-anchor="start">Soll</text><rect class="l fb" x="14" y="49" width="200" height="26" rx="0"/><text class="t" x="24" y="67" text-anchor="start">− Ist</text><text class="t2" x="222" y="67" text-anchor="start">die Lücke heute</text><rect class="l bgf" x="14" y="82" width="200" height="26" rx="0"/><text class="t" x="24" y="100" text-anchor="start">+ Neubedarf − Minderbedarf</text><rect class="l fg" x="14" y="115" width="200" height="26" rx="0"/><text class="t" x="24" y="133" text-anchor="start">− Zugänge</text><text class="t2" x="222" y="133" text-anchor="start">Rückkehr, Übernahme</text><rect class="l fr" x="14" y="148" width="200" height="26" rx="0"/><text class="t" x="24" y="166" text-anchor="start">+ Abgänge</text><text class="t2" x="222" y="166" text-anchor="start">Rente, Kündigung</text><rect class="l fo" x="14" y="181" width="200" height="26" rx="0"/><text class="t" x="24" y="199" text-anchor="start">= Nettobedarf</text></svg>