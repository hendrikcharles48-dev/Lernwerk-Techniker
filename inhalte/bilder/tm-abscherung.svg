<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-label="Abscherung: Zwei Bleche ziehen in entgegengesetzte Richtungen. Der Bolzen wird in der Fuge abgeschert. Die Scherspannung ist τ_a = F / A, bei einer Scherfläche ist A = π · d² / 4."><rect class="fl" x="40" y="50" width="140" height="30" rx="0"/><rect class="l" x="40" y="50" width="140" height="30" rx="0"/><rect class="fl" x="180" y="80" width="140" height="30" rx="0"/><rect class="l" x="180" y="80" width="140" height="30" rx="0"/><rect class="l bgf" x="165" y="35" width="30" height="90" rx="0"/><line class="r" x1="150.0" y1="80.0" x2="210.0" y2="80.0"/><text class="rt" x="222" y="72" text-anchor="start">Scherfläche</text><line class="b" x1="40.0" y1="65.0" x2="11.2" y2="65.0"/><polygon class="bf" points="4.0,65.0 12.3,61.5 12.3,68.5"/><text class="bt" x="10" y="55" text-anchor="middle" style="font-size:15px;">F</text><line class="b" x1="320.0" y1="95.0" x2="348.8" y2="95.0"/><polygon class="bf" points="356.0,95.0 347.7,98.5 347.7,91.5"/><text class="bt" x="350" y="85" text-anchor="middle" style="font-size:15px;">F</text><text class="bt" x="180" y="160" text-anchor="middle">Einschnittig: τ<tspan dy="4" style="font-size:0.75em">a</tspan><tspan dy="-4">​</tspan> = F / A</text><text class="t2" x="180" y="182" text-anchor="middle">mit A = π · d² / 4</text></svg>