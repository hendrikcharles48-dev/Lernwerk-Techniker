<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img" aria-label="Einfacher Stromkreis: Die Quelle treibt den Strom I durch den Widerstand R. An R fällt die Spannung U ab. Das ohmsche Gesetz: U = R · I, also I = U / R."><rect class="l" x="70" y="40" width="220" height="130" rx="0"/><circle class="l bgf" cx="70" cy="105" r="13"/><line class="l" x1="70.0" y1="92.0" x2="70.0" y2="118.0"/><text class="t" x="50" y="109" text-anchor="end">U</text><rect class="l bgf" x="281.0" y="77.0" width="18" height="56" rx="0"/><text class="t" x="305.0" y="109" text-anchor="start">R</text><line class="r" x1="150.0" y1="40.0" x2="202.8" y2="40.0"/><polygon class="rf" points="210.0,40.0 201.7,43.5 201.7,36.5"/><text class="rt" x="180" y="30" text-anchor="middle" style="font-size:15px;">I</text><line class="b" x1="320.0" y1="70.0" x2="320.0" y2="132.8"/><polygon class="bf" points="320.0,140.0 316.5,131.7 323.5,131.7"/><text class="bt" x="328" y="110" text-anchor="start">U</text><text class="t" x="180" y="112" text-anchor="middle" style="font-size:18px;">U = R · I</text><text class="t2" x="180" y="196" text-anchor="middle">Mehr Spannung, mehr Strom. Mehr Widerstand, weniger Strom.</text></svg>