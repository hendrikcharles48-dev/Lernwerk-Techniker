<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img" aria-label="Gemischte Schaltung: R₂ und R₃ sind parallel, das ist die Gruppe. Erst die Gruppe ausrechnen, R₂₃ = R₂ · R₃ / (R₂ + R₃). Dann kommt R₁ in Reihe dazu."><rect class="l" x="40" y="50" width="280" height="120" rx="0"/><circle class="l bgf" cx="40" cy="110" r="13"/><line class="l" x1="40.0" y1="97.0" x2="40.0" y2="123.0"/><text class="t" x="20" y="114" text-anchor="end">U</text><rect class="l bgf" x="98.0" y="42.0" width="44" height="16" rx="0"/><text class="t" x="120" y="36.0" text-anchor="middle">R₁</text><line class="l" x1="230.0" y1="50.0" x2="230.0" y2="170.0"/><circle class="lf" cx="230" cy="50" r="3.2"/><circle class="lf" cx="230" cy="170" r="3.2"/><rect class="l bgf" x="222.0" y="90.0" width="16" height="40" rx="0"/><text class="t" x="244.0" y="114" text-anchor="start">R₂</text><rect class="l bgf" x="312.0" y="90.0" width="16" height="40" rx="0"/><text class="t" x="334.0" y="114" text-anchor="start">R₃</text><rect class="d" x="212" y="38" width="126" height="144" rx="0"/><text class="t2" x="275" y="30" text-anchor="middle">erst die Gruppe</text><text class="bt" x="180" y="200" text-anchor="middle">R<tspan dy="4" style="font-size:0.75em">ges</tspan><tspan dy="-4">​</tspan> = R₁ + R₂ · R₃ / (R₂ + R₃)</text></svg>