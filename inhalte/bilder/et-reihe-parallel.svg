<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Links in Reihe: Der Strom geht nacheinander durch beide Widerstände, R = R₁ + R₂. Rechts parallel: Jeder Widerstand liegt an derselben Spannung, 1 / R = 1 / R₁ + 1 / R₂."><rect class="l" x="40" y="50" width="120" height="120" rx="0"/><circle class="l bgf" cx="40" cy="110" r="13"/><line class="l" x1="40.0" y1="97.0" x2="40.0" y2="123.0"/><text class="t" x="20" y="114" text-anchor="end">U</text><rect class="l bgf" x="64.0" y="43.0" width="32" height="14" rx="0"/><text class="t" x="80" y="37.0" text-anchor="middle">R₁</text><rect class="l bgf" x="112.0" y="43.0" width="32" height="14" rx="0"/><text class="t" x="128" y="37.0" text-anchor="middle">R₂</text><line class="r" x1="160.0" y1="90.0" x2="160.0" y2="132.8"/><polygon class="rf" points="160.0,140.0 156.5,131.7 163.5,131.7"/><text class="rt" x="150" y="120" text-anchor="end">I</text><text class="t" x="100" y="196" text-anchor="middle">Reihe: R = R₁ + R₂</text><text class="t2" x="100" y="212" text-anchor="middle">gleicher Strom überall</text><rect class="l" x="210" y="50" width="120" height="120" rx="0"/><circle class="l bgf" cx="210" cy="110" r="13"/><line class="l" x1="210.0" y1="97.0" x2="210.0" y2="123.0"/><text class="t" x="190" y="114" text-anchor="end">U</text><line class="l" x1="270.0" y1="50.0" x2="270.0" y2="170.0"/><rect class="l bgf" x="263.0" y="92.0" width="14" height="36" rx="0"/><text class="t" x="283.0" y="114" text-anchor="start">R₁</text><rect class="l bgf" x="323.0" y="92.0" width="14" height="36" rx="0"/><text class="t" x="343.0" y="114" text-anchor="start">R₂</text><circle class="lf" cx="270" cy="50" r="3.2"/><circle class="lf" cx="270" cy="170" r="3.2"/><text class="t" x="270" y="196" text-anchor="middle">Parallel: 1/R = 1/R₁ + 1/R₂</text><text class="t2" x="270" y="212" text-anchor="middle">gleiche Spannung an jedem</text></svg>