<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 205" role="img" aria-label="Ein Quadrat mit der Seite a + b: Darin stecken ein großes Quadrat a², ein kleines b² und zwei gleiche Streifen a · b. Deshalb ist (a + b)² = a² + 2ab + b² und nicht nur a² + b²."><rect class="fb" x="50" y="15" width="110" height="110" rx="0"/><rect class="fo" x="160" y="125" width="55" height="55" rx="0"/><rect class="fg" x="160" y="15" width="55" height="110" rx="0"/><rect class="fg" x="50" y="125" width="110" height="55" rx="0"/><rect class="l" x="50" y="15" width="165" height="165" rx="0"/><line class="l" x1="160.0" y1="15.0" x2="160.0" y2="180.0"/><line class="l" x1="50.0" y1="125.0" x2="215.0" y2="125.0"/><text class="bt" x="105.0" y="76.0" text-anchor="middle" style="font-size:20px;">a²</text><text class="ot" x="187.5" y="158.5" text-anchor="middle" style="font-size:18px;">b²</text><text class="gt" x="187.5" y="75.0" text-anchor="middle">a · b</text><text class="gt" x="105.0" y="157.5" text-anchor="middle">a · b</text><text class="t" x="42" y="70.0" text-anchor="end">a</text><text class="t" x="42" y="152.5" text-anchor="end">b</text><text class="t" x="105.0" y="198" text-anchor="middle">a</text><text class="t" x="187.5" y="198" text-anchor="middle">b</text><text class="t" x="290" y="90" text-anchor="middle" style="font-size:15px;">(a + b)²</text><text class="t" x="290" y="112" text-anchor="middle">= a² + 2ab + b²</text></svg>