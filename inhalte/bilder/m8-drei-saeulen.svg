<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img" aria-label="Drei-Säulen-Modell: Nachhaltigkeit ruht auf Ökologie, Ökonomie und Sozialem. Eine Maßnahme ist erst nachhaltig, wenn sie alle drei Säulen beachtet, also Umwelt, Geld und Menschen."><polygon class="l fl" points="40.0,60.0 180.0,15.0 320.0,60.0"/><text class="t" x="180" y="50" text-anchor="middle">Nachhaltigkeit</text><rect class="l fg" x="52" y="66" width="56" height="110" rx="0"/><text class="gt" x="80" y="128" text-anchor="middle">Ökologie</text><rect class="l fb" x="152" y="66" width="56" height="110" rx="0"/><text class="bt" x="180" y="128" text-anchor="middle">Ökonomie</text><rect class="l fo" x="252" y="66" width="56" height="110" rx="0"/><text class="ot" x="280" y="128" text-anchor="middle">Soziales</text><rect class="l fl" x="30" y="176" width="300" height="16" rx="0"/><text class="t2" x="180" y="206" text-anchor="middle">Fehlt eine Säule, trägt das Dach nicht</text></svg>