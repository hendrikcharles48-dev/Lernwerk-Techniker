<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" role="img" aria-label="Zugstab: Die Kraft F zieht an beiden Enden. Im Schnitt verteilt sie sich auf die Fläche A. Die Zugspannung ist σ = F / A, in N/mm²."><rect class="fb" x="90" y="60" width="180" height="40" rx="0"/><rect class="l" x="90" y="60" width="180" height="40" rx="0"/><line class="r" x1="90.0" y1="80.0" x2="32.8" y2="80.0"/><polygon class="rf" points="24.0,80.0 34.1,75.7 34.1,84.3"/><text class="rt" x="30" y="70" text-anchor="middle" style="font-size:15px;">F</text><line class="r" x1="270.0" y1="80.0" x2="327.2" y2="80.0"/><polygon class="rf" points="336.0,80.0 325.9,84.3 325.9,75.7"/><text class="rt" x="330" y="70" text-anchor="middle" style="font-size:15px;">F</text><line class="d" x1="180.0" y1="50.0" x2="180.0" y2="110.0"/><text class="t2" x="180" y="135" text-anchor="middle">Querschnitt A</text><text class="bt" x="180" y="158" text-anchor="middle" style="font-size:16px;">σ = F / A</text><text class="t2" x="180" y="40" text-anchor="middle">gedachter Schnitt</text></svg>