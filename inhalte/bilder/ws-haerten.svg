<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Härten und Anlassen: Erwärmen bis etwa 30 bis 50 K über die Linie G S, halten, dann schnell abschrecken. Danach wieder erwärmen und anlassen, das nimmt Sprödigkeit. Beides zusammen heißt Vergüten."><line class="l" x1="50.0" y1="195.0" x2="333.6" y2="195.0"/><polygon class="lf" points="340.0,195.0 332.6,198.1 332.6,191.9"/><line class="l" x1="50.0" y1="195.0" x2="50.0" y2="21.4"/><polygon class="lf" points="50.0,15.0 53.1,22.4 46.9,22.4"/><text class="t2" x="340" y="211" text-anchor="end">Zeit</text><text class="t2" x="56" y="19" text-anchor="start">T</text><polyline class="r" points="50.0,195.0 110.0,50.0 160.0,50.0 172.0,191.0 200.0,191.0 225.0,120.0 285.0,120.0 330.0,185.0"/><line class="d" x1="50.0" y1="70.0" x2="340.0" y2="70.0"/><text class="t2" x="338" y="64" text-anchor="end">Linie G S</text><text class="rt" x="135" y="42" text-anchor="middle">Härten: 30 bis 50 K über G S</text><text class="bt" x="185" y="181" text-anchor="middle">abschrecken</text><text class="ot" x="255" y="112" text-anchor="middle">Anlassen</text></svg>