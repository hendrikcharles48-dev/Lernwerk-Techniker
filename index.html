<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernwerk</title>
<meta name="description" content="Lernwerk Techniker: Lern-App für die Fachschule Technik">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernwerk">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script>
  // Darstellung vor dem ersten Zeichnen setzen, damit nichts aufblitzt
  try { var t = JSON.parse(localStorage.getItem('lernwerk:theme') || '"auto"'); if (t === 'hell') document.documentElement.setAttribute('data-theme', 'light'); if (t === 'dunkel') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body>
<div id="boot">Lernwerk lädt …</div>
<main id="screens">
  <section class="tabscreen on" data-tab="heute"></section>
  <section class="tabscreen" data-tab="faecher"></section>
  <section class="tabscreen" data-tab="plus"></section>
  <section class="tabscreen" data-tab="fehler"></section>
  <section class="tabscreen" data-tab="mehr"></section>
</main>
<nav class="tabbar" aria-label="Bereiche">
  <button type="button" data-tab="heute" class="on"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg><span>Heute</span></button>
  <button type="button" data-tab="faecher"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="4" width="4.5" height="16" rx="1.2"/><rect x="9.8" y="4" width="4.5" height="16" rx="1.2"/><path d="M15.1 5.2l3.9-1 3 15.4-3.9 1z"/></svg><span>Fächer</span></button>
  <button type="button" data-tab="plus" class="plus" aria-label="Einfügen"><span class="plus-c"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></span><span>Einfügen</span></button>
  <button type="button" data-tab="fehler"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h10.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10.5"/><path d="M11.7 7.5v3.3M11.7 12.2v.1"/></svg><span>Fehlerbuch</span></button>
  <button type="button" data-tab="mehr"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M7.8 12h.1M12 12h.1M16.2 12h.1" stroke-width="2.6"/></svg><span>Mehr</span></button>
</nav>
<div id="sheets"></div>
<button id="update" type="button">Neue Version, tippen zum Laden</button>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">Lernwerk braucht JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
